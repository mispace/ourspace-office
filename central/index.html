<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central @mispace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>">
<meta name="theme-color" content="#EDF1F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Central">
<link rel="manifest" href='data:application/manifest+json,{"name":"Central @mispace","short_name":"Central","display":"standalone","background_color":"%23EDF1F8","theme_color":"%23EDF1F8","start_url":"./"}'>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ tokens · studio.ourspace.com.br (produto vivo · 31/07) ============ */
:root{
  --canvas:#EDF1F8; --card:#FFFFFF; --off:#F7F5FF; --line:#EDF1F7; --line2:#F5F8FC;
  --ink:#0F172A; --sub:#556070; --faint:#556070;
  --brand:#7C3AED; --brand-dark:#6D28D9;
  --grad:linear-gradient(135deg,#7C3AED 0%,#4F46E5 100%);
  --brand-pale:#EDE9FE; --gold:#7C3AED; --gold-pale:#F5F3FF; --gold-deep:#6D28D9; --nude:#C7D2FE;
  --up:#047857; --up-bg:#D1FAE5; --mid:#556070; --mid-bg:#F1F5F9;
  --down:#B91C1C; --down-bg:#FEE2E2; --age:#92400E; --age-bg:#FEF3C7; --slate:#0284C7;
  --sh-sm:0 1px 3px rgba(16,24,40,.04),0 12px 28px -16px rgba(16,24,40,.20);
  --sh-md:0 2px 4px rgba(16,24,40,.05), 0 18px 40px -16px rgba(16,24,40,.16);
  --nav-h:60px; --fab:calc(60px + env(safe-area-inset-bottom,0px) + 12px);
  --w:640px;   /* a MESMA largura manda no #top e no .wrap · 780 numa tela de 1.440 deixava 440px de vazio de cada lado */
  --r-lg:18px; --r-md:13px; --r-sm:9px;   /* 3 degraus de raio · antes eram 12 valores soltos */
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
/* tirar o flash cinza do toque sem dar resposta nenhuma deixa o toque mudo: a resposta é a opacidade */
button:active,.golink:active,.agl .dp:active,#nav button:active{opacity:.6}
html{-webkit-text-size-adjust:100%}
body{font:14px/1.5 'Inter',system-ui,sans-serif;font-weight:400;color:var(--ink);background:var(--canvas);
     -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
     padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px)}
a{color:var(--ink)}
.disp{font-family:'Plus Jakarta Sans','Inter',sans-serif}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:18px;margin:16px 0}
.k{text-transform:uppercase;color:var(--sub)}
.wrap{max-width:var(--w);margin:0 auto;
      padding-left:calc(14px + env(safe-area-inset-left,0px));padding-right:calc(14px + env(safe-area-inset-right,0px))}
.pill{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-up{color:var(--up);background:var(--up-bg)} .p-mid{color:var(--mid);background:var(--mid-bg)}
.p-down{color:var(--down);background:var(--down-bg)} .p-none{color:var(--sub);background:var(--mid-bg)}
/* ===== mesa de sinais (RADAR · redesenho 07/08, direção B + enxertos de A) ===== */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sig{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0;background:var(--card);
     border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:13px 12px 9px}
.sig>div{min-width:0}
.sig.full,.sig.exp{grid-column:1/-1}
.sig .sl{font:800 11.5px 'Inter',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);
         display:flex;align-items:center;gap:5px}
.sig .sn{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-weight:800;font-size:26px;
         letter-spacing:-.02em;line-height:1.05}
.sig .sn.txt{font-size:18px;line-height:1.2}
.sig .sn .un{font:700 13px 'Inter',sans-serif;color:var(--sub);letter-spacing:0}
.sig .sr{font-size:13px;color:var(--sub);line-height:1.45}
.sig .sa{margin-top:auto}
.sig .abre{display:block;border:0;background:none;color:var(--gold-deep);font:600 13px 'Inter',sans-serif;
           text-align:left;padding:0;min-height:44px;cursor:pointer}
.sig .mais{display:none;border-top:1px solid var(--line2);margin-top:6px;padding-top:8px}
.sig.exp .mais{display:block}
.sig .sd{font-size:11.5px;color:var(--faint);margin-top:2px}
.anel{width:46px;height:46px;flex:0 0 auto}
@media(min-width:768px){.sgrid{grid-template-columns:1fr 1fr 1fr}}
/* rosquinha: proporção de um todo (barra empilhada é veto dela, GOSTO_LOG 03/08) */
.donutw{display:flex;gap:16px;align-items:center;margin:6px 0 2px}
.dleg{flex:1;min-width:0}
/* leitura padrão de card: o número + o que fazer com ele (pedido dela 07/08) */
.leit{position:relative;margin-top:10px;border-radius:12px;padding:10px 12px 10px 15px;
  font:500 12.5px/1.6 'Inter',sans-serif;color:var(--ink);
  background:linear-gradient(135deg,var(--off),#FDFCFF);border:1px solid var(--brand-pale)}
.leit::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--grad)}
.leit b{font-weight:700}
.leit .verbo{display:block;margin-top:3px;color:var(--gold-deep);font-weight:700}
.age{display:inline-block;font-size:11.5px;color:var(--faint);margin-left:6px;font-weight:500}
.age.stale{color:var(--age);background:var(--age-bg);border-radius:9px;padding:0 6px;font-weight:600}
/* tags de pilar · pastéis quentes que casam com o dourado */
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:9px;
     font-size:11.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-aut{background:#EDE9FE;color:#5B21B6}.t-edu{background:#E0F2FE;color:#0369A1}
.t-pro{background:#E0E7FF;color:#3730A3}.t-ofe{background:#F1F5F9;color:#475569}
.t-des{background:#FCE7F3;color:#9D174D}
.btn{display:inline-block;background:var(--grad);color:#fff;text-decoration:none;font-weight:600;
     border-radius:13px;padding:12px 22px;font-size:13px;border:0;cursor:pointer;letter-spacing:.01em}
h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700;color:var(--ink);margin:22px 2px 2px;line-height:1.2;letter-spacing:-.01em}
h2 .age{vertical-align:3px}
.sub-h{font-size:13px;color:var(--sub);margin:0 2px 8px}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--gold-deep)}
details[open] summary{color:var(--ink)}
details .body{font-size:13px;color:var(--sub);padding:6px 0 2px;line-height:1.55}
.linha{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:13px;align-items:baseline}
.linha:first-of-type{border-top:0}
.linha .n{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.05}
.sm{font-size:11.5px;color:var(--sub)}
.golink{font-weight:600;color:var(--gold-deep);text-decoration:none;font-size:13px;padding:3px 0;display:inline-block}
/* logos dos canais */
.logo{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;vertical-align:-8px;margin-right:8px}
.logo svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.logo b{font:700 13px 'Inter',sans-serif;color:#fff}
.lg-ig{background:#C13584}.lg-tt{background:#1A1A1A}.lg-li{background:#0A66C2}.lg-blog{background:var(--brand)}
/* ============ lock ============ */
#lock{position:fixed;inset:0;background:var(--canvas);display:flex;align-items:center;justify-content:center;z-index:60}
#skel div{height:74px;background:linear-gradient(180deg,var(--line2),var(--off));border-radius:var(--r-lg);margin:10px 0}
#lock .box{width:min(330px,88vw);text-align:center}
#lock .dots{height:22px;margin:0 auto 16px;width:220px;background:radial-gradient(circle,var(--gold) 1.5px,transparent 1.7px) 0 0/11px 11px}
#lock h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:32px;font-weight:800}
#lock input{width:100%;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:13px;margin:14px 0 10px;background:#fff;font-family:'Inter',sans-serif}
#lockmsg{font-size:13px;color:var(--down);min-height:18px}
/* ============ topo + navegação ============ */
/* topo: fundo FRIO (o greige quente era o último bege da página) + vidro seguro.
   O glass fica só aqui: altura fixa, não rola por dentro, existe um só, fallback
   opaco no @supports e ZERO animação na página · a receita que quebrou a tela dela
   antes foi backdrop-filter + animação infinita em página alta. */
#top{position:sticky;top:0;z-index:40;background:rgba(248,250,252,.94);border-bottom:1px solid var(--line);padding:9px 0}
@supports (backdrop-filter:blur(12px)){
  #top{background:rgba(248,250,252,.72);backdrop-filter:blur(14px) saturate(1.5);contain:paint}
}
#top .row{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
#top .nome{flex:1 1 auto;min-width:0}
#top .ava,#top #ajuda,#top #refresh{flex:0 0 auto}
#top .ava{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font:800 15px 'Plus Jakarta Sans',Inter,sans-serif;letter-spacing:.02em;color:var(--brand);
  background:var(--off);border:2px solid transparent;
  background-image:linear-gradient(var(--off),var(--off)),var(--grad);background-origin:border-box;background-clip:content-box,border-box}
#top .oi{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;line-height:1.05}
#top .dt{font-size:11.5px;color:var(--sub)}
.marcha{min-height:44px;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
        display:inline-flex;align-items:center;margin-left:auto;font-size:11.5px;font-weight:600;color:var(--gold-deep);background:var(--gold-pale);
        border:1px solid var(--brand-pale);border-radius:999px;padding:5px 12px;text-decoration:none;white-space:nowrap}
/* a pílula pede 79px e tem 64 em 393: saía cortada no meio («🎚 Norma»), sem nem o «…»
   (ellipsis não vale dentro de inline-flex). Escondê-la devolve 71px para a coluna do
   nome, onde o carimbo de frescor também cortava. Reaparece na folha de ajuda. */
.dsem3{display:none}
@media(max-width:420px){
  .marcha{display:none}
  /* o carimbo de frescor pedia 200px no pior dia («domingo, 28 de set · agora há pouco»)
     e a coluna do nome tem 179: esconder a pílula devolveu 63px, mas os botões ? e ↻ em
     44px (alvo mínimo) levaram 8 de volta. O dia da semana em 3 letras, como a AGENDA já
     escreve, baixa o pior caso para 176, e o gap em 8px dá 185 de coluna: 8,7 de sobra em
     todo dia da semana e em todo estado do carimbo. Medido no DOM em 375px. */
  .dsem{display:none}
  .dsem3{display:inline}
  #top .row{gap:8px}
}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);
     padding-bottom:env(safe-area-inset-bottom)}
#nav .row{display:flex;max-width:var(--w);margin:0 auto;
          padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#nav button{flex:1;min-width:0;height:var(--nav-h);border:0;background:none;cursor:pointer;display:flex;flex-direction:column;
            align-items:center;justify-content:center;gap:3px;font:600 11px 'Inter',sans-serif;letter-spacing:.04em;color:var(--faint)}
#nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
                border-radius:999px;padding:3px 12px;box-sizing:content-box}
#nav button[aria-selected="true"]{color:var(--ink)}
@media(max-width:420px){ /* 8 abas no 375: menos ar no icone e fonte 10px, sem cortar toque */
  #nav button{font-size:10px;letter-spacing:.02em}
  #nav button svg{padding:3px 7px}
}
/* 8 abas em 375px dão 46,9px por botão e «NÚMEROS» pedia 52,3: a tela mostrava
   «STORIESNÚMEROS», colado. Medido no DOM: 9px ainda encosta; com 8,5px e sem
   espaçamento de letra os oito nomes cabem com 3,6px de folga, em 375 e em 360. */
@media(max-width:400px){
  #nav button{font-size:8.5px;letter-spacing:0}
}
/* em 360px o botão cai para 45px e «NÚMEROS» ficava com 1,7px de sobra: 8px devolve 4,2 */
@media(max-width:370px){
  #nav button{font-size:8px}
}
#nav button[aria-selected="true"] svg{background:var(--gold-pale);color:var(--gold-deep)}
#nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
[hidden]{display:none!important}
@media(min-width:768px) and (min-height:600px){
  body{padding-bottom:20px;padding-left:220px}
  :root{--fab:20px;--w:780px}   /* a barra virou coluna: flutuante não precisa subir 72px */
  #nav{left:0;right:auto;top:0;bottom:0;width:220px;border-top:0;border-right:1px solid var(--line);overflow-y:auto}
  #nav .row{flex-direction:column;padding-top:clamp(10px,7vh,76px);gap:2px}
  #nav button{flex:0 0 auto;height:46px;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 18px;font-size:13px}
  #nav button svg{padding:3px 8px}
}
/* celular deitado (812x375): barra embaixo, nunca coluna lateral de 220px com 255px de conteúdo */
@media(max-height:500px){
  :root{--nav-h:48px}
  #nav{position:fixed;left:0;right:0;top:auto;bottom:0;width:auto;border-top:1px solid var(--line);border-right:0}
  #nav .row{flex-direction:row}
  body{padding-left:0}
}
.agcol,.agcol2{min-width:0}
@media(min-width:1100px){
  :root{--w:1040px}
  /* a altura sobra: TERÇA, HOJE e AGENDA em 2 colunas */
  #v-terca,#v-hoje,#v-agenda{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 20px;align-items:start}
  #v-terca>.larga,#v-hoje>.larga,#v-agenda>.larga,#v-hoje>.acao,#v-hoje>#banner,#v-terca>h2,#v-agenda>h2{grid-column:1/-1}
  /* 10/11/2026, reclamação dela com print do computador: a Mesa era um desenho de celular
     esticado. Medido no 1440: quatro linhas fechadas ocupavam 1.012 px de largura por 64 px
     de altura, cada uma com uma frase só, e a peça da semana ficava sozinha numa coluna com
     496 px vazios ao lado. Fechada, a linha passa a ocupar uma coluna e a emparelhar com a
     vizinha; aberta, volta a ocupar a largura inteira, que é onde o texto longo precisa estar. */
  #v-terca>details.verm.larga:not([open]){grid-column:auto;margin:7px 0}
  #v-terca>details.verm:not([open])>summary{padding:2px 0}
  #v-terca>details.verm:not([open]){padding:9px 13px}
}
/* 10/11/2026: no 1800 o conteúdo ficava preso em 1.040 px dentro de uma área de 1.580, com
   270 px de vão morto de cada lado, e a tela lia como desenho de celular esticado. A largura
   passa a crescer com a janela, em dois degraus, e nunca passa de 1.460 para a linha de texto
   não ficar longa demais de ler. */
@media(min-width:1500px){ :root{--w:1280px} }
@media(min-width:1760px){ :root{--w:1460px} }
/* ============ HOJE ============ */
#banner{border-radius:13px;background:var(--age-bg);color:var(--age);font-weight:500;font-size:13px;padding:10px 13px;margin:10px 0 0;line-height:1.5}
/* degradê marca a coisa MAIS importante da tela, nunca vira textura: a ação do dia,
   as barras de progresso e um véu de 230px atrás do topo. Só isso. */
.acao{position:relative;overflow:hidden;border:1.5px solid var(--brand-pale);border-radius:var(--r-lg);background:#fff;box-shadow:var(--sh-md);padding:16px;margin:16px 0 8px}
.acao::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad)}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:230px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(124,58,237,.07),rgba(99,102,241,0))}
.acao .verb{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:clamp(20px,5.6vw,26px);letter-spacing:-.02em;line-height:1.12}
.acao .why{color:var(--sub);font-size:13px;margin-top:7px}
.acao .btn{margin-top:13px}
.seca{display:flex;gap:10px;align-items:baseline;padding:11px 13px}
.seca .tx{font-size:13px;color:var(--sub)}.seca .tx b{font-weight:600;color:var(--ink)}
.seca .golink{margin-left:auto}
/* segmented */
.cabblk{margin-bottom:6px}
.prow>div:first-child{flex-wrap:wrap;gap:4px}
.prow .er{margin-left:auto}
/* auditoria mobile 05/08: header de 3 linhas comia 11% da tela e cobria as sub-abas */
.onel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
/* dentro de card o nome da série era cortado em 160 de 216px: duas linhas acomodam */
.card .onel{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;max-width:100%}
.agirb{border:1px solid var(--brand-pale);background:var(--off);color:var(--brand-dark);border-radius:13px;padding:7px 11px;font:700 11.5px Inter,sans-serif;cursor:pointer;min-height:44px;margin-left:6px}
.agirb:active{transform:scale(.97)}
/* corte na borda direita (medido em 375px: links da FILA saíam 79px para fora):
   filho de flex/grid não encolhe sozinho, precisa de min-width:0 */
.linha,.linha>span,.dp,.dp>div,.grp,.card>div{min-width:0}
.linha>span,.dp .tt,.card a.golink{overflow-wrap:break-word;word-break:normal}
.num,.n,.pill,.age{overflow-wrap:normal;word-break:keep-all}
.linha{gap:10px}
.tfix{max-width:100%}
.xscroll{overflow-x:auto;overscroll-behavior-x:contain}
/* a tabela rodava em 283px e pedia 418 em 375: três paddings se somavam antes dela
   (14+14+18). Na faixa estreita ela sangra o card e recupera 36px. */
.tsangra{overflow-x:auto;overscroll-behavior-x:contain}
@media(max-width:560px){.tsangra{margin:0 -18px;padding:0 18px}}
.pulso{display:flex;gap:8px;margin:10px 0}
.pulso .pz{flex:1;background:#fff;border-radius:var(--r-md);padding:12px 8px;text-align:center;box-shadow:var(--sh-sm)}
.pulso .pi{font-size:13px;line-height:1;opacity:.75}
.pulso .pv{font:800 20px/1.1 'Plus Jakarta Sans',Inter,sans-serif;letter-spacing:-.02em;margin:5px 0 2px;color:var(--ink)}
.pulso .pv.txt{font-size:13px;line-height:1.3;letter-spacing:0}
.pulso .pl{font-size:11.5px;color:var(--sub);margin-top:1px}
/* auditoria mobile 04/08: alvo de toque mínimo (link de 19px era metade do recomendado) */
/* alvo de toque sem quebrar a quebra de linha: padding vertical em elemento inline
   aumenta a área clicável e deixa o texto continuar quebrando (inline-flex não deixava) */
/* 10/11/2026 · «padding:14px 0» dava altura e largura nenhuma: em 375px o «abrir ↗»
   media 29,4px, contra 44 de alvo mínimo. O padding lateral resolve 70 dos 90 casos. */
.golink,a.golink{display:inline;padding:14px 8px;overflow-wrap:break-word}
/* a receita da casa: padding vertical em elemento inline aumenta a área de toque e deixa o
   texto continuar quebrando · 14px porque com 11 o «abrir ↗» da agenda media 38 px */
/* 10/11/2026 · esta regra vem depois da .golink e zerava o padding lateral dela: o
   «abrir ↗» de HOJE e da agenda media 29,4px de largura, contra 44 de alvo mínimo */
.linha a,.dp a,.agl a{display:inline;padding:15px 8px}
/* a coluna da tabela de POSTS tem 47px: aqui o link ocupa a célula inteira, senão o
   padding lateral o deixaria em 37px de alvo */
#tabelaposts td a.golink{display:block;min-width:44px;box-sizing:border-box;padding:15px 2px;text-align:center}
/* o ⚡ NÃO entra na regra de cima: «.dp button» vencia «.agirb», zerava o padding lateral
   e, por display:inline, ignorava o min-height · media 14x45,5px, e é o que escreve. */
.dp button.agirb{display:inline-flex;align-items:center;justify-content:center;
                 padding:7px 11px;min-width:44px;min-height:44px}
summary{min-height:44px;display:flex;align-items:center;gap:6px}

<script>
"use strict";
const MODE="enc"; // o publish_v3 troca para "enc" ao publicar
const $=s=>document.querySelector(s);
window.addEventListener("error",e=>{const el=$("#err");el.textContent="Erro na página: "+e.message;el.hidden=false;});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const DIAS=["segunda","terça","quarta","quinta","sexta","sábado","domingo"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const LIMITES={posts:4,stories:2,learning:9,insights:21,tiktok:9,linkedin:9,trello:2,crm:2,mes:2,blog:9,events:14,formatos:14,youtube:9,publico:40,ideias:20,radar:40}; // 03/11: igualado ao qa_v3.py (learning, insights, events divergiam)
const TAGCLS={"Autoridade":"t-aut","Educação":"t-edu","Prova/bastidores":"t-pro","Lifestyle":"t-des","Desejo/curadoria":"t-des","Oferta":"t-ofe"};
const tag=(p,extra)=>'<span class="tag '+(TAGCLS[p]||"t-aut")+(extra?" "+extra:"")+'">'+esc((p||"").split("/")[0])+"</span>";
const LOGOS={yt:'<svg viewBox="0 0 24 24" style="width:15px;height:15px;vertical-align:-2px;margin-right:5px" fill="#FF0033"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9.2v5.6L15 12z" fill="#fff"/></svg>',
  ig:'<span class="logo lg-ig"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="#fff" stroke="none"/></svg></span>',
  tt:'<span class="logo lg-tt"><svg viewBox="0 0 24 24"><path d="M14 4v9.5a4 4 0 1 1-3-3.87"/><path d="M14 4c.5 2.6 2.3 4.2 5 4.5"/></svg></span>',
  li:'<span class="logo lg-li"><b>in</b></span>',
  blog:'<span class="logo lg-blog"><svg viewBox="0 0 24 24"><path d="M5 19l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L9 18l-4 1z"/></svg></span>'
};

const fmtAbs=iso=>{ if(!iso) return "sem carimbo"; const t=String(iso); return t.slice(8,10)+"/"+t.slice(5,7)+(t.length>10?" "+t.slice(11,16):""); };
// links agrupados: "Responder" primeiro, porque é o que espera por ela.
// Cada um diz para que serve, senão o nome do arquivo não ajuda ninguém.
// «quando cada dado chegou» · veio da aba FILA (dissolvida em 10/11): a folha de ajuda
// já é o lugar do «como ler esta central», e o bloco é o mesmo, com o mesmo carimbo.
function atualizacoesHtml(){
  const S=D.sources||{};
  const NOMES={posts:"Instagram · posts",stories:"Instagram · stories",trello:"Trello (fila/agenda)",crm:"CRM (pipeline)",learning:"Leitura da semana",insights:"Leituras (análises)",tiktok:"TikTok",linkedin:"LinkedIn",events:"Eventos (agenda)",blog:"Blog",formatos:"Formatos (espelho da planilha)"};
  return '<div class="card" style="margin:6px 0">'
    +Object.keys(NOMES).filter(k=>S[k]).map(k=>{
      const st=S[k]; const dias=st.at?(Date.now()-new Date(String(st.at).slice(0,10)+"T12:00:00").getTime())/864e5:99;
      const ok=st.ok&&dias<=(LIMITES[k]??9);
      // sem data NÃO é «conferido nesta rodada»: em checkout raso a idade chega vazia
      if(!st.at) return '<div class="linha"><span>'+esc(NOMES[k])+'</span><span class="sm num">'+(st.ok?"não sei dizer quando chegou":"sem dado")+"</span></div>";
      return '<div class="linha"><span>'+esc(NOMES[k])+'</span><span class="sm num" style="font-weight:600;color:'+(ok?"var(--sub)":"var(--age)")+'">'+fmtAbs(st.at)+(ok?"":" · parado")+"</span></div>";
    }).join("")+"</div>";
}
function gruposDeLinks(){
  const L=D.links||[];
  const ORDEM=["Responder","Trabalhar","Público e pesquisa","Dinheiro","Você","Sistema"];
  const por={};
  L.forEach(l=>{ const g=l.g||"Outros"; (por[g]=por[g]||[]).push(l); });
  const gs=ORDEM.filter(g=>por[g]).concat(Object.keys(por).filter(g=>ORDEM.indexOf(g)<0));
  return gs.map(g=>'<div class="sm" style="font-weight:800;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em">'+esc(g)+"</div>"
    +por[g].map(l=>'<div style="margin:5px 0">'+lk(l.url,esc(l.t)+" ↗","golink")
      +(l.d?'<div class="sm" style="margin-top:1px">'+esc(l.d)+"</div>":"")+"</div>").join("")).join("");
}
// JANELA DE TEMPO · as fixas vem prontas do build (a pagina nunca recalcula).
// So a faixa livre e somada aqui, com a mesma formula e sobre as mesmas linhas.
// Abaixo de 5 posts com medida o numero aparece e o veredito nao.
let JANELA = null;   // null = tudo

function janelaAtual(){
  const js = D.janelas || [];
  if(JANELA === null) return js.find(j => j.dias === null) || null;
  if(typeof JANELA === "number") return js.find(j => j.dias === JANELA) || null;
  return JANELA;  // faixa livre, montada por faixaLivre()
}

function faixaLivre(de, ate){
  const linhas = ((D.posts||{}).all||[]).filter(p => p.ts && p.ts >= de && p.ts <= ate);
  const med = linhas.filter(p => p.er !== null && p.er !== undefined);
  const n = x => parseFloat(String(x).replace(",", "."));
  const media = k => med.length ? (med.reduce((a,p)=>a+n(p[k]),0)/med.length) : null;
  const f1 = v => v===null ? null : String(Math.round(v*10)/10).replace(".",",");
  const ser = ((D.followers||{}).series||[]).filter(x => x.d >= de && x.d <= ate);
  return {
    dias: "livre", rot: fmtAbs(de)+" a "+fmtAbs(ate), de: fmtAbs(de), ate: fmtAbs(ate),
    n: linhas.length, n_medidos: med.length, n_stories: null,
    er: med.length ? f1(media("er"))+"%" : null,
    sends: med.length ? f1(media("sends"))+"%" : null,
    reach: null,
    seg: ser.length>=2 ? (ser[ser.length-1].v-ser[0].v>=0?"+":"−")+Math.abs(ser[ser.length-1].v-ser[0].v) : null,
    ini: de, fim: ate,
    confia: med.length >= 5,
    ressalva: med.length >= 5 ? null :
      (med.length===1 ? "1 post com medida neste período · número real, mas ainda não é tendência"
                      : med.length+" posts com medida neste período · número real, mas ainda não é tendência"),
    livre: true
  };
}

function barraJanela(){
  const js = D.janelas || [];
  if(!js.length) return "";
  return '<div class="jan" id="barrajan">'
    + js.map(j => '<button data-j="'+(j.dias===null?"tudo":j.dias)+'" aria-selected="'+(j.dias===null)+'">'
        + (j.dias===null ? "tudo" : j.dias+" dias") + "</button>").join("")
    + '<span class="datas"><input type="date" id="jde" aria-label="de"><input type="date" id="jate" aria-label="até">'

  document.querySelectorAll("#barrajan button").forEach(b => {
    const v = b.dataset.j;
    const on = (v==="tudo" && JANELA===null) || (v!=="tudo" && v!=="livre" && Number(v)===JANELA)
             || (v==="livre" && j && j.livre);

  });

  if(av){

  }
  const põe = (id, v) => { const e=document.getElementById(id); if(e) e.textContent = (v===null||v===undefined) ? "sem dado" : v; };
  if(j){

    if(nt){ nt.textContent=j.seg_nota||""; nt.hidden=!j.seg_nota; }
    põe("jn-n", j.n_medidos + (j.n_medidos===1 ? " post" : " posts"));
    põe("jn-per", j.de + " a " + j.ate);
  }

  const ini = j ? (j.ini || "") : "", fim = j ? (j.fim || "9999") : "9999";
  document.querySelectorAll("[data-pts]").forEach(el => {
    const t = el.dataset.pts || "";
    el.hidden = !!(t && (t < ini || t > fim));
  });
  // faixa sem post nenhum deixava três blocos vazios na tela (achado 07/08)
  const vis=[...document.querySelectorAll("tr[data-pts]")].filter(x=>!x.hidden).length;

  ["#grade","#tabelaposts"].forEach(sel=>{

function ligaJanela(){
  const bar = document.getElementById("barrajan");

    const v = b.dataset.j;

// UMA conta de idade para a página inteira, de meia-noite a meia-noite. Eram três, e
// duas arredondavam hora fracionária: a MESMA data saía «há 27d» no crachá e «há 28d»
// no item, e «98 dias» em cima com «99 dias» embaixo (10/11/2026).
function diasDe(iso){
  if(!iso) return null;
  const a=new Date(String(iso).slice(0,10)+"T00:00:00");
  if(isNaN(a.getTime())) return null;
  const hj=new Date();
  return Math.round((new Date(hj.getFullYear(),hj.getMonth(),hj.getDate())-a)/864e5);
}
function fmtAge(iso){
  if(!iso) return null;
  const t=String(iso);
  // 10/11/2026: quando o dado traz SO A DATA, o codigo montava iso+"T12:00:00" e
  // inventava meio-dia. TikTok, LinkedIn e YouTube, colhidos as 15h13 e 15h50, saiam
  // como «há 4h» as 16h25, quando a idade real era de 35 a 70 minutos. Sem hora no
  // dado, a resposta e em dias: «hoje», «ontem», «há N dias».
  if(t.length<=10){
    const dd=diasDe(t);
    if(dd==null) return null;
    if(dd<=0) return "hoje";
    if(dd===1) return "ontem";
    return "há "+dd+"d";
  }
  const d=new Date(t);
  const h=(Date.now()-d.getTime())/36e5;
  if(!isFinite(h)) return null;
  if(h<1.5) return "agora há pouco";
  if(h<30) return "há "+Math.round(h)+"h";
  return "há "+Math.round(h/24)+"d";
}
const fmtMil=v=>String(v).replace(/\B(?=(\d{3})+(?!\d))/g,".");
const vg=x=>String(Number(x).toFixed(1)).replace(".",",");

function anelSvg(pct,cor){
  const r=15.9155; // circunferência 100: o dasharray vira % direto
  return '<svg class="anel" viewBox="0 0 36 36" aria-hidden="true">'
    +'<circle cx="18" cy="18" r="'+r+'" fill="none" stroke="var(--mid-bg)" stroke-width="3.5"/>'
    +'<circle cx="18" cy="18" r="'+r+'" fill="none" stroke="'+cor+'" stroke-width="3.5" stroke-linecap="round"'
    +' stroke-dasharray="'+Math.max(2,Math.min(100,pct)).toFixed(1)+' 100" transform="rotate(-90 18 18)"/></svg>';
}
function donutSvg(list,base,cores){ // rosquinha com o % do maior escrito no centro
  const R=34,C=2*Math.PI*R;let off=0,arcs="";
  list.forEach((x,i)=>{const p=x.v/(base||1);
    arcs+='<circle r="'+R+'" cx="45" cy="45" fill="none" stroke="'+cores[i%cores.length]+'" stroke-width="13" stroke-dasharray="'+(p*C).toFixed(1)+' '+C.toFixed(1)+'" stroke-dashoffset="'+(-off*C).toFixed(1)+'" transform="rotate(-90 45 45)"/>';off+=p;});
  const topPct=Math.round(1000*list[0].v/(base||1))/10;
  return '<svg width="92" height="92" viewBox="0 0 90 90" role="img" aria-label="proporção">'+arcs
    +'<text x="45" y="49" text-anchor="middle" font-size="14" font-weight="800" font-family="Plus Jakarta Sans,Inter,sans-serif" fill="#0F172A">'+String(topPct).replace(".",",")+'%</text></svg>';
}

function ageChip(S,key){
  const s=S[key]; if(!s) return "";
  if(!s.ok) return '<span class="age stale">sem dado</span>';
  const rel=fmtAge(s.at); if(!rel) return "";
  const dias=diasDe(s.at);
  const stale=dias!=null&&dias>(LIMITES[key]??9);
  // o crachá dizia «há 3h» sem dizer que é a hora em que a Central LEU o Instagram,
  // grudado na data de publicação do post. Agora diz, como já dizia em «parado».
  return '<span class="age'+(stale?" stale":"")+'">'+(stale?"parado ":"lido ")+rel+"</span>";

const lk=(url,txt,cls)=>url?('<a '+(cls?'class="'+cls+'" ':'')+'href="'+esc(url)+'" target="_blank" rel="noopener">'+txt+"</a>"):txt;
function sparkSvg(vals,h,datas,cls){
  if(!vals||vals.length<2) return "";
  const lo=Math.min(...vals), hi=Math.max(...vals), rng=(hi-lo)||1, n=vals.length;
  // espaça por DATA quando ela existe: por índice, um dia sem coleta sumia e a
  // linha mentia sobre o ritmo (achado 05/08)
  let x = i => i/(n-1)*100;
  if(datas && datas.length===n){
    const t = datas.map(d=>Date.parse(d+"T12:00:00"));
    if(t.every(v=>!isNaN(v))){
      const t0=t[0], span=(t[n-1]-t0)||1;
      x = i => (t[i]-t0)/span*100;
    }
  }
  const pts=vals.map((v,i)=>x(i).toFixed(1)+","+((h-4)-(v-lo)/rng*(h-10)).toFixed(1));
  return '<svg class="spark'+(cls?" "+cls:"")+'" viewBox="0 0 100 '+h+'" preserveAspectRatio="none">'
    +'<polyline points="'+pts.join(" ")+' 100,'+h+' 0,'+h+'" fill="rgba(124,58,237,.16)" stroke="none"/>'
    +'<polyline points="'+pts.join(" ")+'" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/></svg>';
}

// A pergunta dela é «o que tem nos próximos dias e o que eu tenho que fazer». A lista

// intervalo vazio vira UMA linha.
const zz=n=>String(n).padStart(2,"0");
const isoDe=d=>d.getFullYear()+"-"+zz(d.getMonth()+1)+"-"+zz(d.getDate());
const maisDias=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return isoDe(d);};
const ICO={dinheiro:"💰",prazo:"⏰",evento:"🎤",comemorativa:"🎉"};

function agDados(){

  (((D.fila||{}).agenda)||[]).forEach(a=>push(a.due,{

    // a procedência da OCORRÊNCIA vem na frente: «🔁 Ritual da semana · segunda e sexta»
    // saía duas vezes, as duas dizendo «no board Operação», sem explicar o segundo dia
    sub:(a.org==="recorrência escrita no nome do card"?"dia escrito no nome do card"
        :a.idade?("escrito há "+a.idade+(a.idade===1?" dia":" dias")+", não confirmado")
        :a.board?("no board "+a.board)

  ((D.posts||{}).all||[]).forEach(p=>{ if((p.ts||"")>=hoje) push(p.ts,{ic:"📷",t:p.t||"post publicado",url:p.url,sub:"post publicado"}); });
  return dias;
}
function linhaDoDia(iso,itens){
  const hoje=isoDe(new Date()), d=new Date(iso+"T12:00:00"), wd=(d.getDay()+6)%7;
  const dd=iso.slice(8,10)+"/"+iso.slice(5,7);
  const rot=(iso===hoje?"hoje":iso===maisDias(hoje,1)?"amanhã":DIAS[wd].slice(0,3)+" "+dd);
  return '<div class="dia'+(wd>=5?" fds":"")+'">'+esc(rot)
    +((iso===hoje||iso===maisDias(hoje,1))?' <span class="q">'+DIAS[wd].slice(0,3)+" "+dd+"</span>":"")
    +(wd>=5?' <span class="q">· seu</span>':"")+"</div>"
    +itens.map(i=>'<div class="dp"><span class="ic">'+i.ic+'</span><div style="flex:1;min-width:0">'
      +'<div class="tt">'+esc(i.t)+'</div><div class="sm">'+esc(i.sub)+"</div>"
      +(i.conta?'<div class="sm" style="color:var(--down)">⚠ '+esc(i.conta)+"</div>":"")
      +(i.div?'<div class="sm">⚠ a data está no nome do card · '+esc(i.div)+"</div>":"")+"</div>"
      +'<span style="white-space:nowrap;flex:0 0 auto">'+(i.url?lk(i.url,"abrir ↗","golink"):"")
      +((i.card&&D.acao)?' <button class="agirb" data-card="'+esc((i.url||"").split("/").filter(Boolean).pop())+'" data-tit="'+esc(i.t)+'" data-ctx="agenda">⚡</button>':"")
      +"</span></div>").join("");
}
function blocoDias(dias,de,ate,pula,maxItens){
  // devolve [html, quantos itens entraram]. «pula» descarta os primeiros N itens, que são
  // os que já estão à vista: bloco de «ver mais» que repete o que está em cima engorda a
  // tela sem dizer nada novo.
  let out="", vazio=null, n=0, p=(pula||0);
  const _onde=" "+(((D.fila||{}).vago_suf)||"no Trello");
  const fecha=(fim)=>{ if(vazio&&vazio!==fim){ out+='<div class="vago">de '+vazio.slice(8,10)+"/"+vazio.slice(5,7)+" a "+fim.slice(8,10)+"/"+fim.slice(5,7)+", nada marcado"+_onde+"</div>"; }
    else if(vazio){ out+='<div class="vago">'+vazio.slice(8,10)+"/"+vazio.slice(5,7)+", nada marcado"+_onde+"</div>"; } vazio=null; };
  for(let k=de;k<=ate;k++){
    const iso=maisDias(isoDe(new Date()),k);
    const tinha=(dias[iso]||[]).length>0;
    let it=dias[iso]||[];
    if(p>0&&it.length){ const corta=Math.min(p,it.length); p-=corta; it=it.slice(corta); }
    if(!it.length){ if(!vazio&&!tinha) vazio=iso; continue; }   // dia que já está à vista não é dia vazio
    if(maxItens&&n>=maxItens) break;   // dia com conteúdo nunca vira «nada marcado»
    if(maxItens) it=it.slice(0,maxItens-n);
    if(vazio) fecha(maisDias(iso,-1));
    out+=linhaDoDia(iso,it); n+=it.length;
  }
  return [out,n];
}
function faixaHtml(dias){
  // a faixa só existe no computador: 3 semanas, hoje na primeira coluna. O véu roxo é o
  // ER médio daquele dia da semana, que é a informação que o fundo roxo já carregava.
  const MH=D.melhor_hora||{}, por={}; let max=0;
  (MH.dias||[]).forEach(x=>{ const v=parseFloat(String(x.er).replace(",","."))||0;
    por[x.nome]={er:v,n:x.n}; if(v>max) max=v; });
  const hoje=isoDe(new Date());
  let out='<div class="wk">';
  for(let k=0;k<21;k++){
    const iso=maisDias(hoje,k), d=new Date(iso+"T12:00:00"), wd=(d.getDay()+6)%7;
    const nome=DIAS[wd].slice(0,3), r=por[nome];
    let bg="";
    if(max>0&&r&&r.n>0){ const a=(0.03+r.er/max*0.09).toFixed(3);
      bg=";background-image:linear-gradient(rgba(124,58,237,"+a+"),rgba(124,58,237,"+a+"))"; }
    out+='<div class="wd'+(iso===hoje?" hoje":"")+'" style="'+bg.slice(1)+'" title="'+esc(nome+" "+iso.slice(8,10)+"/"+iso.slice(5,7)+(r?" · ER médio "+r.er.toFixed(1).replace(".",",")+"% em "+r.n+" posts":""))+'">'
      +'<div class="dl">'+nome+((max>0&&r&&r.er===max)?" ★":"")+"</div>"
      +'<div class="dn num">'+iso.slice(8,10)+"</div>"
      +'<div class="mk">'+((dias[iso]||[]).length?"•":"")+"</div></div>";
  }
  return out+"</div>"
    +'<div class="sm" style="margin:4px 2px">3 semanas · o fundo roxo é o que rende em cada dia da semana (ER médio dos seus posts) · ★ o seu melhor dia · • tem algo marcado</div>';
}

// do data.json. Como o data e sempre buscado sem cache e a pagina pode ficar guardada no

// ====================== TERÇA · o rascunho dela ======================
// A Central é página estática e cifrada: não existe servidor que receba escrita. O destino
// do que ela escreve é COMENTÁRIO no card do Trello, postado pela própria página com
// trello(). O armazenamento do navegador é rascunho enquanto ela digita e rede de
// segurança se o envio falhar ou se o token não estiver colado · nunca destino final.
const TK="cv3t1:";   // a versão do formato vive no prefixo: mudou o formato, vira cv3t2
function terLe(k){ try{ const v=localStorage.getItem(TK+k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function terChaves(){ const o=[];
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf(TK)===0) o.push(k.slice(TK.length)); } }catch(e){}
  return o; }
function terGrava(k,txt,enviado){
  try{
    const a=terLe(k)||{};
    let env=(enviado!==undefined?enviado:(a.enviado||null));
    // texto mexido depois do envio volta a ser rascunho: senão a tela diz «enviado ✓»
    // para um texto que nunca foi, e a linha dos atrasados não o enxerga
    if(enviado===undefined && env && txt!==a.t) env=null;
    const o={t:txt,at:new Date().toISOString().slice(0,16),enviado:env};
    if(!txt&&!o.enviado){ localStorage.removeItem(TK+k); return; }
    localStorage.setItem(TK+k,JSON.stringify(o));
    terQuota();
  }catch(e){}   // o acessador estoura em janela privada e com dados do site bloqueados
}
function terQuota(){
  // no máximo 50 chaves · cai a mais antiga pelo at, e só o que JÁ foi enviado.
  // Rascunho nunca enviado não é descartado por trava nenhuma.
  try{
    if(terChaves().length<=50) return;
    const env=terChaves().map(k=>[k,terLe(k)]).filter(x=>x[1]&&x[1].enviado)
      .sort((a,b)=>String(a[1].at).localeCompare(String(b[1].at)));
    for(let i=0;i<env.length&&terChaves().length>50;i++) localStorage.removeItem(TK+env[i][0]);
  }catch(e){}
}
function terGC(reg){
  // a FONTE é que manda apagar: id já fechado na fonte perde o rascunho, e por isso a
  // limpeza se regenera sozinha a cada rodada
  try{ (reg||[]).forEach(id=>localStorage.removeItem(TK+id)); }catch(e){}
}
function terTipo(k){ const i=k.indexOf(":"); return [k.slice(0,i),k.slice(i+1)]; }
function terPref(k){
  const [tipo,id]=terTipo(k);
  if(tipo==="resp") return id;                       // já vem como mesa.* ou caixa.*
  if(tipo==="card"||tipo==="peca") return "card."+id;
  if(tipo==="gosto") return "gosto."+id.split(":")[0];
  return tipo+"."+id;
}
function terCard(k){ const [tipo,id]=terTipo(k); return (tipo==="card"||tipo==="peca")?id:null; }
function terEstado(k){
  const el=document.querySelector('[data-st="'+k+'"]'); if(!el) return;
  const o=terLe(k);
  if(!o||(!o.t&&!o.enviado)){ el.innerHTML=""; return; }
  if(o.enviado&&o.enviado.url)
    el.innerHTML='<b style="color:var(--up)">enviado ✓</b> '+lk(o.enviado.url,"ver o comentário ↗","golink")
      +((o.enviado.nota)?' · <span style="color:var(--age)">'+esc(o.enviado.nota)+"</span>":"");
  else if(o.erro)
    el.innerHTML='<b style="color:var(--down)">não enviado</b> · '+esc(o.erro)
      +' · <button class="tercop" data-cop="1">copiar tudo</button>';
  else

function terBloco(){
  // monta o bloco de forma SINCRONA: nada de await antes de copiar, senão o iOS perde o
  // gesto e a cópia falha calada
  // o comentário sai com o token DELA: sem dizer de quem é, a resposta dela a uma
  // decisão da Mesa (que não tem card próprio) podia ser lida como saída de robô
  const T=D.terca||{}, L=["💬 Michelle na Central · TERÇA "+(T.hoje||"")], envs=[];
  let jaFoi=0;
  document.querySelectorAll("#v-terca textarea[data-tk]").forEach(ta=>{
    const k=ta.dataset.tk, v=(ta.value||"").trim(); if(!v) return;
    const st=terLe(k); if(st&&st.enviado&&st.t===v){ jaFoi++; return; }   // já foi: não reenvia
    if(terTipo(k)[0]==="pergunta"){ L.push("= pergunta minha: "+v); envs.push({k:k,txt:v,card:null}); return; }
    L.push("#"+terPref(k)+" = "+v);
    envs.push({k:k,txt:v,card:terCard(k)});
  });
  terChaves().forEach(k=>{
    if(document.querySelector('[data-tk="'+k+'"]')) return;      // esse já entrou acima
    const o=terLe(k); if(!o||!o.t||o.enviado) return;
    const v=o.t+" (atrasado)";
    if(terTipo(k)[0]==="pergunta") L.push("= pergunta minha: "+v);
    else L.push("#"+terPref(k)+" = "+v);
    envs.push({k:k,txt:v,card:terCard(k)});
  });
  return {txt:L.join("\n"),envs:envs,n:L.length-1,jaFoi:jaFoi};
}
function copiaFallback(txt){
  // a receita que funciona no Safari do iPhone: readonly para o teclado não subir,
  // contentEditable porque o iOS só seleciona campo editável, 16px para a tela não dar
  // zoom, seleção por Range e só então o execCommand
  try{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.readOnly=true; ta.contentEditable="true";
    ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
    document.body.appendChild(ta);
    const r=document.createRange(); r.selectNodeContents(ta);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    ta.setSelectionRange(0,999999);
    const ok=document.execCommand("copy");
    sel.removeAllRanges(); ta.remove();
    return ok;
  }catch(e){ return false; }
}
function folhaTexto(txt){
  const sh=sheet('<div style="font:800 15px Inter,sans-serif">selecione e copie à mão</div>'
    +'<textarea readonly style="width:100%;height:40vh;margin-top:10px;font:400 16px/1.5 Inter,sans-serif;padding:10px;border:1.5px solid var(--line);border-radius:10px;-webkit-appearance:none"></textarea>');
  const ta=sh.querySelector("textarea"); ta.value=txt; ta.focus(); ta.setSelectionRange(0,999999);
}
function terCopia(){
  const b=terBloco();
  if(!b.n){ const a=aviso(b.jaFoi?"tudo que está escrito já foi enviado":"não tem nada escrito ainda"); setTimeout(()=>a.remove(),2500); return; }
  const ok=()=>{ const a=aviso("copiado ✓"); setTimeout(()=>a.remove(),2500); };
  try{
    if(window.isSecureContext&&navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(b.txt).then(ok).catch(()=>{ if(copiaFallback(b.txt)) ok(); else folhaTexto(b.txt); });
      return;
    }
  }catch(e){}
  if(copiaFallback(b.txt)) ok();
  else { aviso("não deu para copiar · selecione o texto à mão","#B91C1C"); folhaTexto(b.txt); }
}

// ====================== AGIR DE DENTRO ======================
// A página escreve no Trello direto do navegador (a API responde com CORS liberado,
// verificado em 04/08). A chave do app vem no data.json, que é publicado CIFRADO.
// O token é DELA: digitado uma vez e guardado cifrado no aparelho com a mesma chave
// PBKDF2 que abre a Central. Nada destrutivo: arquivar e apagar não existem aqui.
let UNDO = null;

function chaveSessao(){
  const b = sessionStorage.getItem("cv3_key");
  if(!b) return null;
  const bin = atob(b), arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr.buffer;
}
async function aesKey(){
  const bits = chaveSessao();
  if(!bits) return null;
  return crypto.subtle.importKey("raw", bits, {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
}
async function guardaToken(tok){
  const k = await aesKey();
  if(!k){ localStorage.setItem("cv3_tok_claro", tok); return; }   // modo claro local
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, new TextEncoder().encode(tok));
  localStorage.setItem("cv3_tok", JSON.stringify({
    iv: btoa(String.fromCharCode(...iv)),
    ct: btoa(String.fromCharCode(...new Uint8Array(ct)))
  }));
}
async function leToken(){
  const claro = localStorage.getItem("cv3_tok_claro");
  if(claro) return claro;
  const raw = localStorage.getItem("cv3_tok");
  if(!raw) return null;
  const k = await aesKey();
  if(!k) return null;
  try{
    const o = JSON.parse(raw);
    const b = s => { const bin=atob(s), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; };
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(o.iv)}, k, b(o.ct));
    return new TextDecoder().decode(pt);
  }catch(e){ return null; }
}

async function trello(metodo, caminho, params){
  const A = (D.acao||{});
  const tok = await leToken();
  if(!A.key || !tok) throw new Error("falta a chave do Trello nesta rodada");
  const u = new URL("https://api.trello.com/1" + caminho);
  u.searchParams.set("key", A.key); u.searchParams.set("token", tok);
  Object.entries(params||{}).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u, {method: metodo});
  if(!r.ok) throw new Error(r.status===401?"o Trello não aceitou o seu acesso · cole o código de novo":r.status===404?"esse card não existe mais no board":"o Trello não respondeu agora · tente de novo em 1 minuto");
  return r.json();
}

async function agir(cardId, titulo, contexto){
  const A = D.acao || {};
  if(!A.key){ aviso("esta rodada saiu sem a chave do Trello · tente na próxima"); return; }
  if(!(await leToken())){ return pedeToken(); }
  const L = A.listas || {};
  const acoes = [];
  // «Aprovar» move para a lista Publicar do board CONTEÚDO, e o ⚡ agora aparece também
  // em card do Operação: um toque mandaria um card de dinheiro para o board de conteúdo.
  // O verbo fica só nas três filas que, por construção, são listas do Conteúdo.
  if(L.publicar && ["aprovar","gravar","reaproveitar"].indexOf(contexto) >= 0)
    acoes.push({id:"aprovar", ico:"✅", rot:"Aprovar", frase:"mover para a lista Publicar",
      faz: () => trello("PUT", "/cards/" + cardId, {idList: L.publicar})});
  acoes.push({id:"concluir", ico:"✓", rot:"Concluir o prazo", frase:"marcar o prazo como concluído",
    faz: () => trello("PUT", "/cards/" + cardId, {dueComplete: "true"})});
  acoes.push({id:"adiar", ico:"📅", rot:"Adiar", frase:"jogar o prazo para o próximo dia útil",
    faz: () => {
      const d = new Date(); d.setDate(d.getDate() + 1);
      while(d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);  // fim de semana é dela
      d.setHours(12,0,0,0);
      return trello("PUT", "/cards/" + cardId, {due: d.toISOString()});
    }});
  acoes.push({id:"comentar", ico:"💬", rot:"Comentar", frase:"escrever um comentário no card", pedeTexto:true,
    faz: (txt) => trello("POST", "/cards/" + cardId + "/actions/comments", {text: txt})});

  const sh = sheet(
    '<div class="sm">agir neste card</div>'
    + '<div style="font:800 15px/1.35 Inter,sans-serif;margin:4px 0 12px">' + esc(titulo) + "</div>"
    + acoes.map(a => '<button data-a="' + a.id + '" style="display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;margin-bottom:8px;font:700 13px Inter,sans-serif;cursor:pointer;min-height:48px"><span style="font-size:20px">' + a.ico + '</span><span>' + a.rot + '<br><span class="sm" style="font-weight:400">' + a.frase + "</span></span></button>").join("")
    + '<div class="sm" style="margin-top:6px">arquivar e apagar não existem aqui · isso é sempre no board</div>');

  // o prompt() do iOS pode ser bloqueado, não tem campo de 16px e perde o texto se ela
  // sair: o comentário passa a ser escrito numa folha, com o mesmo campo da TERÇA
  const executa = async (a, txt) => {
      fechaSheet();
      const carregando = aviso("⏳ " + a.rot.toLowerCase() + "…");
      try{
        const antes = await trello("GET", "/cards/" + cardId, {fields:"idList,due,dueComplete"});
        await a.faz(txt);
        carregando.remove();
        if(a.id === "comentar"){
          aviso("✓ comentário publicado no card");
          setTimeout(pedeRodada, 500);
        } else {
          avisoComUndo("✓ " + a.rot.toLowerCase() + " feito", () =>
            trello("PUT", "/cards/" + cardId, {
              idList: antes.idList, due: antes.due || "", dueComplete: String(!!antes.dueComplete)
            }));
          setTimeout(pedeRodada, 800);
        }
      }catch(e){
        carregando.remove();
        aviso("⚠ " + e.message + " · o card não mudou", "#B91C1C");
      }
  };
  acoes.forEach(a => {
    sh.querySelector('[data-a="' + a.id + '"]').onclick = () => {
      if(!a.pedeTexto) return executa(a, null);
      const s2 = sheet('<div style="font:800 15px Inter,sans-serif">Comentar no card</div>'
        + '<div class="sm" style="margin:4px 0 8px">' + esc(titulo) + "</div>"

        + '<button id="cmtok" style="margin-top:10px;width:100%;height:48px;border:0;border-radius:13px;background:var(--grad);color:#fff;font:700 13px Inter,sans-serif;cursor:pointer">enviar o comentário</button>');
      const ta = s2.querySelector("#cmtx"); ta.focus();
      s2.querySelector("#cmtok").onclick = () => {

  });
}


async function deriveKey(pw,saltB64,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(saltB64),iterations:iter,hash:"SHA-256"},base,256);
}
async function decryptEnv(env,keyBits){
  const key=await crypto.subtle.importKey("raw",keyBits,{name:"AES-GCM"},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},key,b64(env.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function boot(){
  $("#skel").hidden=false;

    try{
      const r=await fetch("./data.json",{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      render(await r.json()); return;

      $("#err").textContent="Modo claro: não consegui ler data.json ("+e.message+"). Sirva a pasta com um servidor (python3 -m http.server).";
      $("#err").hidden=false; $("#skel").hidden=true; return;
    }
  }
  let env=null;
  try{ const r=await fetch("./data.enc",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j&&j.ct) env=j; } }catch(e){}
  if(!env){
    $("#err").textContent="Não consegui carregar os dados desta rodada. Puxe a tela para recarregar. Se continuar assim, a última publicação falhou e eu já fui avisada.";
    $("#err").hidden=false; $("#skel").hidden=true; return;
  }
  const cached=sessionStorage.getItem("cv3_key");
  if(cached){ try{ const d=await decryptEnv(env,b64(cached).buffer); setTimeout(()=>render(d),16); return; }catch(e){ sessionStorage.removeItem("cv3_key"); } }
  $("#lock").hidden=false; $("#pw").focus();
  const tenta=async()=>{
    const pw=$("#pw").value; if(!pw) return;
    $("#lockmsg").textContent="abrindo…"; $("#go").disabled=true;
    try{
      const bits=await deriveKey(pw,env.salt,env.iter||200000);
      const data=await decryptEnv(env,bits);
      sessionStorage.setItem("cv3_key",btoa(String.fromCharCode(...new Uint8Array(bits))));
      $("#lock").hidden=true;
      setTimeout(()=>render(data),16);
    }catch(e){ $("#go").disabled=false; $("#lockmsg").textContent="senha não bateu · tenta de novo"; }
  };
  $("#go").addEventListener("click",tenta);
  $("#pw").addEventListener("keydown",e=>{ if(e.key==="Enter") tenta(); });
}
boot();
</script>
</body>
</html>
