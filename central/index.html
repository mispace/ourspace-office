<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central @mispace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ tokens · studio.ourspace.com.br (produto vivo · 31/07) ============ */
:root{
  --canvas:#F4F6FB; --card:#FFFFFF; --off:#F7F5FF; --line:#EDF1F7; --line2:#F5F8FC;
  --ink:#0F172A; --sub:#64748B; --faint:#64748B;
  --brand:#7C3AED; --brand-dark:#6D28D9; --sec:#6366F1;
  --grad:linear-gradient(135deg,#7C3AED 0%,#6366F1 100%);
  --brand-pale:#EDE9FE; --gold:#7C3AED; --gold-warm:#6366F1; --gold-pale:#F5F3FF; --gold-deep:#6D28D9; --nude:#C7D2FE;
  --up:#059669; --up-bg:#D1FAE5; --mid:#64748B; --mid-bg:#F1F5F9;
  --down:#DC2626; --down-bg:#FEE2E2; --age:#B45309; --age-bg:#FEF3C7; --slate:#0284C7;
  --sh-sm:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.10);
  --sh-md:0 2px 4px rgba(16,24,40,.05), 0 18px 40px -16px rgba(16,24,40,.16);
  --nav-h:60px;
  --r-lg:18px; --r-md:13px; --r-sm:9px;   /* 3 degraus de raio · antes eram 12 valores soltos */
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:auto}
body{font:14px/1.5 'Inter',system-ui,sans-serif;font-weight:400;color:var(--ink);background:var(--canvas);
     -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px)}
a{color:var(--ink)}
.disp{font-family:'Plus Jakarta Sans','Inter',sans-serif}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:17px 18px;margin:14px 0}
.k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:700}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.pill{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-up{color:var(--up);background:var(--up-bg)} .p-mid{color:var(--mid);background:var(--mid-bg)}
.p-down{color:var(--down);background:var(--down-bg)} .p-none{color:var(--sub);background:var(--mid-bg)}
.age{display:inline-block;font-size:10px;color:var(--faint);margin-left:6px;font-weight:500}
.age.stale{color:var(--age);background:var(--age-bg);border-radius:6px;padding:0 6px;font-weight:600}
/* tags de pilar · pastéis quentes que casam com o dourado */
.tag{display:inline-flex;align-items:center;gap:6px;height:23px;padding:0 10px;border-radius:8px;
     font-size:11.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-aut{background:#EDE9FE;color:#5B21B6}.t-edu{background:#E0F2FE;color:#0369A1}
.t-pro{background:#E0E7FF;color:#3730A3}.t-ofe{background:#F1F5F9;color:#475569}
.t-des{background:#FCE7F3;color:#9D174D}
.btn{display:inline-block;background:var(--grad);color:#fff;text-decoration:none;font-weight:600;
     border-radius:10px;padding:12px 22px;font-size:13px;border:0;cursor:pointer;letter-spacing:.01em}
h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700;color:var(--ink);margin:22px 2px 2px;line-height:1.2;letter-spacing:-.01em}
h2 .age{vertical-align:3px}
.sub-h{font-size:13px;color:var(--sub);margin:0 2px 8px}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--gold-deep)}
details[open] summary{color:var(--ink)}
details .body{font-size:13px;color:var(--sub);padding:6px 0 2px;line-height:1.55}
.linha{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:13px;align-items:baseline}
.linha:first-of-type{border-top:0}
.linha .n{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.05}
.sm{font-size:11.5px;color:var(--sub)}
.golink{font-weight:600;color:var(--gold-deep);text-decoration:none;font-size:13px;}
/* logos dos canais */
.logo{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;vertical-align:-8px;margin-right:8px}
.logo svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.logo b{font:700 13px 'Inter',sans-serif;color:#fff}
.lg-ig{background:#C13584}.lg-tt{background:#1A1A1A}.lg-li{background:#0A66C2}.lg-blog{background:var(--grad)}.lg-lab{background:var(--brand-dark)}
/* ============ lock ============ */
#lock{position:fixed;inset:0;background:var(--canvas);display:flex;align-items:center;justify-content:center;z-index:60}
#lock[hidden],#app[hidden],#err[hidden],#skel[hidden]{display:none}
#skel div{height:74px;background:linear-gradient(180deg,var(--line2),var(--off));border-radius:var(--r-lg);margin:10px 0}
#lock .box{width:min(330px,88vw);text-align:center}
#lock .dots{height:22px;margin:0 auto 16px;width:220px;background:radial-gradient(circle,var(--gold) 1.5px,transparent 1.7px) 0 0/11px 11px}
#lock h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:30px;font-weight:700}
#lock input{width:100%;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin:14px 0 10px;background:#fff;font-family:'Inter',sans-serif}
#lockmsg{font-size:13px;color:var(--down);min-height:18px}
/* ============ topo + navegação ============ */
/* topo: fundo FRIO (o greige quente era o último bege da página) + vidro seguro.
   O glass fica só aqui: altura fixa, não rola por dentro, existe um só, fallback
   opaco no @supports e ZERO animação na página · a receita que quebrou a tela dela
   antes foi backdrop-filter + animação infinita em página alta. */
#top{position:sticky;top:0;z-index:40;background:rgba(248,250,252,.94);border-bottom:1px solid var(--line);padding:9px 0}
@supports (backdrop-filter:blur(12px)){
  #top{background:rgba(248,250,252,.72);backdrop-filter:blur(14px) saturate(1.5);contain:paint}
}
#top .row{display:flex;align-items:center;gap:10px}
#top .ava{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--gold-pale);border:2px solid transparent;background-image:linear-gradient(#fff,#fff),var(--grad);background-origin:border-box;background-clip:content-box,border-box}
#top .oi{font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:700;line-height:1.05}
#top .dt{font-size:11.5px;color:var(--sub)}
.marcha{min-height:40px;display:inline-flex;align-items:center;margin-left:auto;font-size:11.5px;font-weight:600;color:var(--gold-deep);background:var(--gold-pale);
        border:1px solid var(--brand-pale);border-radius:999px;padding:5px 12px;text-decoration:none;white-space:nowrap}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);
     padding-bottom:env(safe-area-inset-bottom)}
#nav .row{display:flex;max-width:640px;margin:0 auto}
#nav button{flex:1;min-width:0;height:var(--nav-h);border:0;background:none;cursor:pointer;display:flex;flex-direction:column;
            align-items:center;justify-content:center;gap:3px;font:600 10px 'Inter',sans-serif;letter-spacing:.06em;color:var(--faint)}
#nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
                border-radius:999px;padding:3px 12px;box-sizing:content-box}
#nav button[aria-selected="true"]{color:var(--ink)}
#nav button[aria-selected="true"] svg{background:var(--gold-pale);color:var(--gold-deep)}
#nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.view[hidden]{display:none}
@media(min-width:768px){
  body{padding-bottom:20px;padding-left:220px}
  #nav{left:0;right:auto;top:0;bottom:0;width:220px;border-top:0;border-right:1px solid var(--line)}
  #nav .row{flex-direction:column;padding-top:76px;gap:2px}
  #nav button{flex:0 0 auto;height:46px;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 18px;font-size:13px}
  #nav button svg{padding:3px 8px}
  .wrap{max-width:780px}
}
/* ============ HOJE ============ */
#banner{border-radius:10px;background:var(--age-bg);color:var(--age);font-weight:500;font-size:13px;padding:10px 13px;margin:10px 0 0;line-height:1.5}
/* degradê marca a coisa MAIS importante da tela, nunca vira textura: a ação do dia,
   as barras de progresso e um véu de 230px atrás do topo. Só isso. */
.acao{position:relative;overflow:hidden;border:1.5px solid var(--brand-pale);border-radius:var(--r-lg);background:linear-gradient(180deg,#FBFAFF,#fff 42%);box-shadow:var(--sh-md);padding:16px;margin:12px 0 8px}
.acao::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad)}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:230px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(124,58,237,.07),rgba(99,102,241,0))}
.acao .verb{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:clamp(22px,5.6vw,28px);letter-spacing:-.02em;line-height:1.12}
.acao .why{color:var(--sub);font-size:13px;margin-top:7px}
.acao .btn{margin-top:13px}
.seca{display:flex;gap:10px;align-items:baseline;padding:11px 13px}
.seca .tx{font-size:13px;color:var(--sub)}.seca .tx b{font-weight:600;color:var(--ink)}
.seca .golink{margin-left:auto}
/* segmented */
.cabblk{margin-bottom:6px}
.prow>div:first-child{flex-wrap:wrap;gap:4px}
.prow .er{margin-left:auto}
/* auditoria mobile 05/08: header de 3 linhas comia 11% da tela e cobria as sub-abas */
.onel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.agirb{border:1px solid var(--brand-pale);background:var(--off);color:var(--brand-dark);border-radius:14px;padding:7px 11px;font:700 11.5px Inter,sans-serif;cursor:pointer;min-height:36px;margin-left:6px}
.agirb:active{transform:scale(.97)}
/* corte na borda direita (medido em 375px: links da FILA saíam 79px para fora):
   filho de flex/grid não encolhe sozinho, precisa de min-width:0 */
.linha,.linha>span,.dp,.dp>div,.grp,.card>div{min-width:0}
.linha>span,.dp .tt,.card a.golink{overflow-wrap:break-word;word-break:normal}
.num,.n,.pill,.age{overflow-wrap:normal;word-break:keep-all}
.linha{gap:10px}
.tfix{max-width:100%}
.pulso{display:flex;gap:8px;margin:10px 0}
.pulso .pz{flex:1;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:13px 8px;text-align:center;box-shadow:var(--sh-sm)}
.pulso .pi{font-size:13px;line-height:1;opacity:.75}
.pulso .pv{font:800 22px/1.1 'Plus Jakarta Sans',Inter,sans-serif;letter-spacing:-.02em;margin:5px 0 2px;color:var(--ink)}
.pulso .pv.txt{font-size:14px;line-height:1.25;letter-spacing:0}
.pulso .pl{font-size:10px;color:var(--sub);margin-top:1px}
/* auditoria mobile 04/08: alvo de toque mínimo (link de 19px era metade do recomendado) */
/* alvo de toque sem quebrar a quebra de linha: padding vertical em elemento inline
   aumenta a área clicável e deixa o texto continuar quebrando (inline-flex não deixava) */
.golink,a.golink{display:inline;padding:11px 0;overflow-wrap:break-word}
summary{min-height:40px;display:flex;align-items:center;gap:6px}
/* escala tipográfica: 4 degraus com contraste real, no lugar de 7 quase iguais */
.sm{font-size:11.5px}
.k{font-size:11.5px;letter-spacing:.05em;display:flex;align-items:center;gap:6px;font-weight:700;
   padding-bottom:7px;margin-bottom:9px;border-bottom:1px solid var(--line2);flex:1 1 auto}
.hd{padding-bottom:7px;margin-bottom:9px;border-bottom:1px solid var(--line2)}
.hd .k{padding-bottom:0;margin-bottom:0;border-bottom:0}
.tfix td:first-child,.tfix th:first-child{position:sticky;left:0;background:#fff;z-index:1}
@media print{#nav,#top,.seg,#refresh,#ajuda,details:not([open]){display:none!important}
  .view{display:block!important}.card{break-inside:avoid;box-shadow:none;border:1px solid #E2E8F0}}
.cd .best{position:absolute;top:1px;right:3px;font-size:9px;color:#7C3AED;line-height:1}
.jan{display:flex;gap:5px;overflow-x:auto;padding:8px 0 2px;-webkit-overflow-scrolling:touch}
.jan button{flex:0 0 auto;min-height:34px;padding:0 13px;border:1px solid var(--line);border-radius:17px;background:#fff;
  font:700 12.5px 'Inter',sans-serif;color:var(--sub);cursor:pointer;white-space:nowrap}
.jan button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.jan .datas{flex:0 0 auto;display:flex;gap:4px;align-items:center}
.jan input[type=date]{font:600 12px 'Inter',sans-serif;border:1px solid var(--line);border-radius:9px;padding:6px 7px;min-height:34px;color:var(--ink);background:#fff}
#janaviso{font:600 12.5px/1.5 'Inter',sans-serif;color:var(--age);background:var(--age-bg);border-radius:9px;padding:8px 11px;margin:6px 0 2px}
#janaviso[hidden]{display:none}
.jrow{display:flex;gap:8px}
.jtile{flex:1;text-align:center;background:var(--off);border-radius:12px;padding:10px 4px}
.jtile .num{font-size:20px;font-weight:800}
.seg{position:sticky;top:var(--hdr,92px);z-index:30;display:flex;background:var(--mid-bg);border-radius:10px;padding:3px;margin:12px 0 4px}
.seg button{flex:1;height:32px;border:0;border-radius:8px;background:none;font:600 13px 'Inter',sans-serif;color:var(--sub);cursor:pointer}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:var(--sh-sm)}
.subv[hidden]{display:none}
/* KPI cards */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:12px 12px 8px;display:flex;flex-direction:column;position:relative}
.kpi .v{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:32px;letter-spacing:-.02em;line-height:.95;margin:4px 0 2px}
.kpi .d{font-size:11.5px;color:var(--sub)}
.kpi .spark{width:calc(100% + 24px);margin:8px -12px -8px;height:32px;display:block}
.iBtn{min-width:34px;min-height:34px;position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);
      background:var(--off);color:var(--gold-deep);font:600 11.5px 'Inter',sans-serif;cursor:pointer}
.iBox{display:none;font-size:13px;color:var(--sub);line-height:1.55;margin-top:8px;border-top:1px solid var(--line2);padding-top:8px}
.kpi.aberto .iBox{display:block}
.iBox b{color:var(--ink)}
/* pilares / gráficos */
.chart .row{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;padding:5px 0}
.bar{height:10px;border-radius:6px;background:var(--mid-bg);overflow:hidden;position:relative}
.fill{position:absolute;inset:0 auto 0 0;background:var(--grad);border-radius:6px}
.chart .val{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:16px;text-align:right}
.prow .bar2{height:9px;border-radius:6px;background:var(--mid-bg);position:relative;overflow:hidden;margin:9px 0 6px}
.prow .real{position:absolute;inset:0 auto 0 0;background:var(--grad);border-radius:6px}
.prow .alvo{position:absolute;top:-2px;bottom:-2px;width:2.5px;background:var(--ink);opacity:.55}
.prow .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.prow .er{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.05;color:var(--ink)}
.filtro-on{outline:2px solid var(--gold);outline-offset:1px}
/* posts */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 2px 4px}
.post{position:relative;flex:0 0 152px;aspect-ratio:4/5;scroll-snap-align:start;border-radius:14px;overflow:hidden;
      border:1px solid var(--line);background:var(--mid-bg);text-decoration:none;display:block;box-shadow:var(--sh-sm)}
.post img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post .ov{position:absolute;inset:auto 0 0 0;padding:28px 10px 9px;color:#fff;
          background:linear-gradient(180deg,transparent,rgba(15,23,42,.82))}
.post .er{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.05}
.post .m{font-size:10px;opacity:.92}
.post .tg{position:absolute;top:7px;left:7px;transform:scale(.9);transform-origin:left top}
.stt{position:relative;flex:0 0 100px;aspect-ratio:9/16;max-height:182px;background:linear-gradient(160deg,var(--off),var(--mid-bg));border:1px solid var(--line);border-radius:14px;overflow:hidden;scroll-snap-align:start;cursor:pointer}
.stt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stt .ov{position:absolute;inset:auto 0 0 0;padding:22px 8px 7px;color:#fff;background:linear-gradient(180deg,transparent,rgba(15,23,42,.85))}
.stt .g{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.05}
.stt .d{font-size:10px;opacity:.92}
.stt .iBtn{min-width:34px;min-height:34px;position:absolute;top:6px;right:6px;background:rgba(255,255,255,.94)}
.stt.sel{outline:2.5px solid var(--brand);outline-offset:-2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:6px 5px 4px}
td{padding:5px;border-top:1px solid var(--line2)}
tr.dim{opacity:.25}
/* calendário */
.calnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px}
.calnav b{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:700;text-transform:capitalize}
.calnav button{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px;cursor:pointer;color:var(--gold-deep)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.wdays span{font-size:10px;text-transform:uppercase;color:var(--faint);text-align:center;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cd{min-height:58px;border-radius:8px;background:var(--card);border:1px solid var(--line);padding:3px 4px;cursor:pointer;position:relative}
.cd.out{opacity:0;pointer-events:none;border:0;background:none}
.cd.wknd{background:var(--off)}
.cd .dn{font-size:10px;font-weight:600;color:var(--sub)}
.cd.today{outline:2px solid var(--gold);outline-offset:-2px}
.cd.today .dn{color:var(--gold-deep)}
.cd.sel{box-shadow:inset 0 0 0 2.5px var(--brand);border-radius:9px;z-index:1}
.cd.sel .dn{background:var(--brand);color:#fff;border-radius:9px;padding:1px 6px;font-weight:800}
.cd.sel.today{box-shadow:inset 0 0 0 2.5px var(--brand)}
.cd .th{width:36px;height:36px;border-radius:6px;object-fit:cover;display:block;margin:2px auto 0}
.cd .dots{display:flex;gap:3px;justify-content:center;margin-top:4px}
.cd .dot{width:6px;height:6px;border-radius:50%}
.d-post{background:var(--gold)} .d-story{background:var(--nude);border-radius:1px}
.d-due{background:var(--slate);border-radius:1px;transform:rotate(45deg)} .d-ev{background:var(--brand-dark);width:9px;border-radius:1px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin:8px 2px}
.leg i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;font-style:normal}
#daypanel .dp{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
#daypanel .dp:first-of-type{border-top:0}
#daypanel img{width:40px;height:40px;border-radius:8px;object-fit:cover}
#daypanel .tt{font-size:13px;font-weight:600;line-height:1.3}
/* fila */
.grp .hd{display:flex;justify-content:space-between;align-items:baseline}
.grp .hd .n{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.05}
.chartbox{position:relative}

<script>
"use strict";
const MODE="enc"; // o publish_v3 troca para "enc" ao publicar
const $=s=>document.querySelector(s);
window.addEventListener("error",e=>{const el=$("#err");el.textContent="Erro na página: "+e.message;el.hidden=false;});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const DIAS=["segunda","terça","quarta","quinta","sexta","sábado","domingo"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const LIMITES={posts:4,stories:2,learning:9,tiktok:9,linkedin:9,trello:2,crm:2,blog:9,events:14,ourspacelab:40,formatos:14};
const TAGCLS={"Autoridade":"t-aut","Educação":"t-edu","Prova/bastidores":"t-pro","Desejo/curadoria":"t-des","Oferta":"t-ofe"};
const tag=(p,extra)=>'<span class="tag '+(TAGCLS[p]||"t-aut")+(extra?" "+extra:"")+'">'+esc((p||"").split("/")[0])+"</span>";
const LOGOS={
  ig:'<span class="logo lg-ig"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="#fff" stroke="none"/></svg></span>',
  tt:'<span class="logo lg-tt"><svg viewBox="0 0 24 24"><path d="M14 4v9.5a4 4 0 1 1-3-3.87"/><path d="M14 4c.5 2.6 2.3 4.2 5 4.5"/></svg></span>',
  li:'<span class="logo lg-li"><b>in</b></span>',
  blog:'<span class="logo lg-blog"><svg viewBox="0 0 24 24"><path d="M5 19l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L9 18l-4 1z"/></svg></span>',
  lab:'<span class="logo lg-lab"><b>OS</b></span>'
};

const fmtAbs=iso=>{ if(!iso) return "sem carimbo"; const t=String(iso); return t.slice(8,10)+"/"+t.slice(5,7)+(t.length>10?" "+t.slice(11,16):""); };
// links agrupados: "Responder" primeiro, porque é o que espera por ela.
// Cada um diz para que serve, senão o nome do arquivo não ajuda ninguém.
function gruposDeLinks(){
  const L=D.links||[];
  const ORDEM=["Responder","Trabalhar","Público e pesquisa","Dinheiro","Você","Sistema"];
  const por={};
  L.forEach(l=>{ const g=l.g||"Outros"; (por[g]=por[g]||[]).push(l); });
  const gs=ORDEM.filter(g=>por[g]).concat(Object.keys(por).filter(g=>ORDEM.indexOf(g)<0));
  return gs.map(g=>'<div class="sm" style="font-weight:800;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em">'+esc(g)+"</div>"
    +por[g].map(l=>'<div style="margin:5px 0">'+lk(l.url,esc(l.t)+" ↗","golink")
      +(l.d?'<div class="sm" style="margin-top:1px">'+esc(l.d)+"</div>":"")+"</div>").join("")).join("");
}
// JANELA DE TEMPO · as fixas vem prontas do build (a pagina nunca recalcula).
// So a faixa livre e somada aqui, com a mesma formula e sobre as mesmas linhas.
// Abaixo de 5 posts com medida o numero aparece e o veredito nao.
let JANELA = null;   // null = tudo

function janelaAtual(){
  const js = D.janelas || [];
  if(JANELA === null) return js.find(j => j.dias === null) || null;
  if(typeof JANELA === "number") return js.find(j => j.dias === JANELA) || null;
  return JANELA;  // faixa livre, montada por faixaLivre()
}

function faixaLivre(de, ate){
  const linhas = ((D.posts||{}).all||[]).filter(p => p.ts && p.ts >= de && p.ts <= ate);
  const med = linhas.filter(p => p.er !== null && p.er !== undefined);
  const n = x => parseFloat(String(x).replace(",", "."));
  const media = k => med.length ? (med.reduce((a,p)=>a+n(p[k]),0)/med.length) : null;
  const f1 = v => v===null ? null : String(Math.round(v*10)/10).replace(".",",");
  const ser = ((D.followers||{}).series||[]).filter(x => x.d >= de && x.d <= ate);
  return {
    dias: "livre", rot: fmtAbs(de)+" a "+fmtAbs(ate), de: fmtAbs(de), ate: fmtAbs(ate),
    n: linhas.length, n_medidos: med.length, n_stories: null,
    er: med.length ? f1(media("er"))+"%" : null,
    sends: med.length ? f1(media("sends"))+"%" : null,
    reach: null,
    seg: ser.length>=2 ? (ser[ser.length-1].v-ser[0].v>=0?"+":"−")+Math.abs(ser[ser.length-1].v-ser[0].v) : null,
    ini: de, fim: ate,
    confia: med.length >= 5,
    ressalva: med.length >= 5 ? null :
      (med.length===1 ? "1 post com medida neste período · número real, mas ainda não é tendência"
                      : med.length+" posts com medida neste período · número real, mas ainda não é tendência"),
    livre: true
  };
}

function barraJanela(){
  const js = D.janelas || [];
  if(!js.length) return "";
  return '<div class="jan" id="barrajan">'
    + js.map(j => '<button data-j="'+(j.dias===null?"tudo":j.dias)+'" aria-selected="'+(j.dias===null)+'">'
        + (j.dias===null ? "tudo" : j.dias+" dias") + "</button>").join("")
    + '<span class="datas"><input type="date" id="jde" aria-label="de"><input type="date" id="jate" aria-label="até">'
    + '<button data-j="livre" aria-selected="false">aplicar</button></span></div>'
    + '<div id="janaviso" hidden></div>';
}

function aplicaJanela(){
  const j = janelaAtual();
  document.querySelectorAll("#barrajan button").forEach(b => {
    const v = b.dataset.j;
    const on = (v==="tudo" && JANELA===null) || (v!=="tudo" && v!=="livre" && Number(v)===JANELA)
             || (v==="livre" && j && j.livre);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
  const av = document.getElementById("janaviso");
  if(av){
    if(j && j.ressalva){ av.textContent = "⚠ " + j.ressalva; av.hidden = false; }
    else av.hidden = true;
  }
  const põe = (id, v) => { const e=document.getElementById(id); if(e) e.textContent = (v===null||v===undefined) ? "sem dado" : v; };
  if(j){
    põe("jn-er", j.er); põe("jn-sends", j.sends); põe("jn-seg", j.seg);
    põe("jn-n", j.n_medidos + (j.n_medidos===1 ? " post" : " posts"));
    põe("jn-per", j.de + " a " + j.ate);
  }
  // cada linha de post traz a propria data
  const ini = j ? (j.ini || "") : "", fim = j ? (j.fim || "9999") : "9999";
  document.querySelectorAll("[data-pts]").forEach(el => {
    const t = el.dataset.pts || "";
    el.hidden = !!(t && (t < ini || t > fim));
  });
  if(typeof aplicaFiltro === "function") aplicaFiltro();
}

function ligaJanela(){
  const bar = document.getElementById("barrajan");
  if(!bar) return;
  bar.addEventListener("click", ev => {
    const b = ev.target.closest("button"); if(!b) return;
    const v = b.dataset.j;
    if(v === "livre"){
      const de = (document.getElementById("jde")||{}).value, ate = (document.getElementById("jate")||{}).value;
      if(!de || !ate){ aviso("escolha as duas datas"); return; }
      if(de > ate){ aviso("a primeira data tem que vir antes"); return; }
      JANELA = faixaLivre(de, ate);
    } else {
      JANELA = (v === "tudo") ? null : Number(v);
    }
    aplicaJanela();
  });
  aplicaJanela();
}

function fmtAge(iso){
  if(!iso) return null;
  const d=new Date(String(iso).slice(0,16).length>10?iso:iso+"T12:00:00");
  const h=(Date.now()-d.getTime())/36e5;
  if(!isFinite(h)) return null;
  if(h<1.5) return "agora há pouco";
  if(h<30) return "há "+Math.round(h)+"h";
  return "há "+Math.round(h/24)+"d";
}
function ageChip(S,key){
  const s=S[key]; if(!s) return "";
  if(!s.ok) return '<span class="age stale">sem dado</span>';
  const rel=fmtAge(s.at); if(!rel) return "";
  const dias=(Date.now()-new Date(String(s.at).slice(0,10)+"T12:00:00").getTime())/864e5;
  const stale=dias>(LIMITES[key]??9);
  return '<span class="age'+(stale?" stale":"")+'">'+(stale?"parado ":"")+rel+"</span>";
}
function pillHtml(p){
  if(!p) return "";
  const cls={up:"p-up",mid:"p-mid",down:"p-down",none:"p-none"}[p.state]||"p-none";
  return '<span class="pill '+cls+'">'+esc(p.sym)+" "+esc(p.word)+"</span>";
}
const lk=(url,txt,cls)=>url?('<a '+(cls?'class="'+cls+'" ':'')+'href="'+esc(url)+'" target="_blank" rel="noopener">'+txt+"</a>"):txt;
function sparkSvg(vals,h,datas){
  if(!vals||vals.length<2) return "";
  const lo=Math.min(...vals), hi=Math.max(...vals), rng=(hi-lo)||1, n=vals.length;
  // espaça por DATA quando ela existe: por índice, um dia sem coleta sumia e a
  // linha mentia sobre o ritmo (achado 05/08)
  let x = i => i/(n-1)*100;
  if(datas && datas.length===n){
    const t = datas.map(d=>Date.parse(d+"T12:00:00"));
    if(t.every(v=>!isNaN(v))){
      const t0=t[0], span=(t[n-1]-t0)||1;
      x = i => (t[i]-t0)/span*100;
    }
  }
  const pts=vals.map((v,i)=>x(i).toFixed(1)+","+((h-4)-(v-lo)/rng*(h-10)).toFixed(1));
  return '<svg class="spark" viewBox="0 0 100 '+h+'" preserveAspectRatio="none">'
    +'<polyline points="'+pts.join(" ")+' 100,'+h+' 0,'+h+'" fill="rgba(124,58,237,.16)" stroke="none"/>'
    +'<polyline points="'+pts.join(" ")+'" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/></svg>';
}

let D=null, IMGMAP={}, selDay=null, calY=0, calM=0;

function render(data){
  D=data;
  const S=D.sources||{};
  IMGMAP={};
  [].concat(D.posts.top3||[],D.posts.recentes||[],D.posts.all||[]).forEach(p=>{ if(p.img&&p.url) IMGMAP[p.url]=p.img; });
  const hoje=new Date();
  const m=D.meta.marcha||{};
  const ava=(D.posts.top3[0]&&D.posts.top3[0].img)||"";

  // cabeçalho padrão de bloco: título-conclusão · janela do dado · carimbo de frescor
  const cab=(titulo,janela,fonte)=>'<div class="cabblk"><span class="k">'+titulo+"</span>"
    +'<div class="sm num" style="opacity:.8;margin-top:2px">'+(janela?esc(janela):"")
    +(fonte&&S[fonte]?" · "+ageChip(S,fonte):"")+"</div></div>";
  // frase em verbo no topo da aba (o que faço com isto)
  const fraseAba=k=>{const f=(D.frases_aba||{})[k];return f?'<p style="font:700 14px/1.45 Inter,sans-serif;margin:2px 2px 10px">💡 '+esc(f)+"</p>":"";};
  let h='<div id="top"><div class="wrap"><div class="row">'
    +(ava?'<img class="ava" src="'+ava+'" alt="">':'<span class="ava"></span>')
    +'<div><div class="oi">Oi, Michelle</div><div class="dt onel" id="carimbo" style="cursor:pointer" title="toque para ver quando cada dado chegou">'+DIAS[(hoje.getDay()+6)%7]+", "
    +hoje.getDate()+" de "+MESES[hoje.getMonth()].slice(0,3)+" · "+esc(fmtAge(D.meta.built_at)||"")+"</div></div>"
    +lk(m.link,"🎚 "+esc(m.value||"Normal")+(m.ok?"":" (padrão)"),"marcha")
    +'<button id="ajuda" title="como ler esta central" aria-label="como ler" style="width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--gold-deep);font:700 15px Inter,sans-serif;cursor:pointer;margin-right:6px">?</button>'
    +'<button id="refresh" title="atualizar agora" aria-label="atualizar agora" style="width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--gold-deep);font-size:15px;cursor:pointer">↻</button>'
    +"</div></div></div>";

  // ---------- HOJE ----------
  const t=D.today||{}, main=t.main||{};
  // ---------- HOJE (repaginado: ação · pulso · semana · o que vem) ----------
  const SAh=D.saude||{}, NUh=SAh.numero||{}, RTh=SAh.ritmo||{}, BUh=D.buracos||{};
  const _evs=(D.fila&&D.fila.eventos)||[];
  const _acaoTem=e=>!!(e&&t.main&&t.main.t&&t.main.t.indexOf(String(e.t).slice(0,18))>=0);
  const ev1=_evs.length?(_acaoTem(_evs[0])?(_evs[1]||null):_evs[0]):null;
  const _ev1repetido=_evs.length&&_acaoTem(_evs[0]);
  h+='<section class="view wrap" id="v-hoje">'
    +(D.meta.alert?'<div id="banner">'+esc(D.meta.alert)+"</div>":"")
    // 1 · a ação, com a régua embaixo (por que é ela hoje)
    +'<div class="acao"><div class="k" style="color:var(--brand)">🎯 O que fazer hoje</div>'
    +'<div class="verb">'+esc(main.t||"…")+"</div>"
    +'<div class="why">'+esc(main.why||"")+"</div>"
    +(main.url?lk(main.url,esc(main.label||"abrir")+" ↗","btn"):"")
    +((D.acao&&main.url&&/^https:\/\/trello\.com\/c\//.test(main.url))?' <button class="agirb" data-card="'+esc(main.url.split("/").filter(Boolean).pop())+'" data-tit="'+esc(main.t||"")+'" data-ctx="hoje">⚡ agir daqui</button>':"")
    +"</div>"
    // 2 · pulso: 3 números que explicam a escolha, sem virar painel
    +'<div class="pulso">'
    +[[(RTh.frase||"").replace(/^Ritmo: /,""),"📆","ritmo"],
      [esc(NUh.v||"—"),"♡","de cada 100 alcançadas, tantas interagem"],
      [((D.followers&&D.followers.delta)?esc(D.followers.delta):"—")+" seguidores","👤","na semana"]]
      .map(x=>'<div class="pz"><div class="pi">'+x[1]+'</div><div class="pv'+(/^[−+]?[\d]/.test(String(x[0]).trim())?"":" txt")+'">'+x[0]+'</div><div class="pl">'+x[2]+"</div></div>").join("")
    +"</div>"
    // 3 · a semana em 7 quadradinhos (veio da FILA: é visão de hoje, não de fila)
    +(BUh.semana?'<div class="card">'+cab("🗓 "+esc(BUh.frase),"a semana toda numa olhada","trello")
      +'<div style="display:flex;gap:5px;margin-top:8px">'+BUh.semana.map(x=>{
        const cor=x.publicado?"background:#7C3AED;color:#fff":x.cards.length?"background:#EDE9FE;color:#5B21B6":(x.passou?"background:var(--mid-bg);color:var(--faint)":"background:#fff;color:var(--sub);border:1.5px "+(x.fds?"dotted":"dashed")+" var(--line)");
        return '<div title="'+esc(x.d)+(x.cards.length?" · "+esc(x.cards[0].t):"")+'" style="flex:1;text-align:center;border-radius:10px;padding:7px 2px;'+cor+(x.hoje?";box-shadow:0 0 0 2px #6366F1":"")+'">'
          +'<div style="font:800 10px Inter,sans-serif;text-transform:uppercase">'+esc(x.dow)+"</div>"
          +'<div style="font:700 13px Inter,sans-serif">'+esc(x.d.slice(0,2))+"</div>"
          +'<div style="font-size:9px">'+(x.publicado?"✓":x.cards.length?"•":"")+"</div></div>";}).join("")+"</div>"
      +'<div class="sm" style="margin-top:7px">roxo = publicou · lilás = já tem card · tracejado = dia livre · cinza = passou sem post</div></div>':"")
    // 4 · o que vem: evento e story do dia, com um toque cada
    +'<div class="card">'+cab("⏭ O que vem","próximo compromisso e o story de hoje","events")
    +(ev1?'<div class="linha"><span>'+lk(ev1.gcal,esc(ev1.t)+" ↗")+'</span><span class="sm num">'+esc(ev1.d)+"</span></div>"
        :(_ev1repetido?'<div class="sm">depois do compromisso de amanhã, nada marcado</div>'
          :'<div class="sm">nenhum compromisso marcado nos próximos dias</div>'))
    +'<div class="linha"><span>📱 Story de hoje · '+lk(D.fila&&D.fila.ideias?D.fila.ideias.link:null,"pautas ↗","golink")+'</span><span class="sm">'+esc((D.stories||{}).template||"")+"</span></div>"
    +'<div class="linha"><span>📱 Stories na última semana</span><span class="n num">'+((D.stories||{}).n7??"—")+"</span></div>"
    +"</div>"
    // 5 · as secundárias, agora como linhas discretas
    +((t.secondary||[]).length?'<div class="card">'+cab("↩ Se sobrar tempo","o que vem depois da ação de hoje","trello")
      +(t.secondary||[]).map(sx=>'<div class="linha"><span><b>'+esc(sx.t)+"</b> "+'<span class="sm">'+esc(sx.why||"")+"</span></span>"+(sx.url?lk(sx.url,"abrir ↗","golink"):"")+"</div>").join("")
      +"</div>":"")
    +"</section>";

  // ---------- AGENDA ----------
  h+='<section class="view wrap" id="v-agenda" hidden>'+fraseAba("agenda")
    +'<div class="calnav"><button id="cprev" aria-label="mês anterior">‹</button><b id="cmes"></b><button id="cnext" aria-label="próximo mês">›</button></div>'
    +'<div class="wdays">'+["s","t","q","q","s","s","d"].map(x=>"<span>"+x+"</span>").join("")+"</div>"
    +'<div class="cal" id="cal"></div>'
    +'<div class="leg"><span><i class="d-post"></i>post</span><span><i class="d-story"></i>story</span><span><i class="d-due"></i>prazo</span><span><i class="d-ev"></i>evento</span></div>'
    +'<p class="sm" id="callegenda" style="margin:2px 2px 8px"></p>'
    +'<div class="card" id="daypanel"><span class="sm">toque num dia para ver o que tem nele</span></div>'
    +((D.fila&&D.fila.vencidos&&D.fila.vencidos.n)?'<div class="card sm" style="line-height:1.55"><b style="color:var(--down)">'+D.fila.vencidos.n+" cards passaram do prazo no board.</b> Nada muda sozinho: são tarefas antigas com data vencida. "+lk(D.fila.vencidos.link,"Abrir no board ↗","golink")+" e escolher: nova data ou concluir. Se quiser, eu reagendo em lote (me pede).</div>":"")
    +"</section>";

  // ---------- POSTS ----------

function ligaTooltipSeguidores(){
  const folbox=$("#folbox");
  if(folbox){
    const serie=(D.followers||{}).series||[];
    const vals=serie.map(p=>p.v), lo=Math.min(...vals), hi=Math.max(...vals), rng=(hi-lo)||1;
    const mostra=ev=>{
      const r=folbox.getBoundingClientRect();
      const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
      const i=Math.max(0,Math.min(serie.length-1,Math.round(cx/r.width*(serie.length-1))));
      const p=serie[i], ant=i>0?serie[i-1]:null;
      const dd=p.d.slice(8,10)+"/"+p.d.slice(5,7);
      const delta=ant?p.v-ant.v:null;
      const dtx=delta===null?"":(delta>0?' · <span class="pos">+'+delta+" no dia</span>":delta<0?' · <span class="neg">'+delta+" no dia</span>":" · = igual");
      const x=i/(serie.length-1)*r.width;
      const svgTop=folbox.querySelector("svg").offsetTop, svgH=folbox.querySelector("svg").offsetHeight;
      const y=svgTop+( (26-(p.v-lo)/rng*20)/30 )*svgH;
      const tip=$("#foltip"), dot=$("#foldot");
      tip.innerHTML="<b>"+dd+"</b> · "+String(p.v).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" seguidores"+dtx;
      tip.style.left=Math.max(70,Math.min(r.width-70,x))+"px"; tip.style.top=y+"px"; tip.style.display="block";
      dot.style.left=x+"px"; dot.style.top=y+"px"; dot.style.display="block";
    };
    const some=()=>{ $("#foltip").style.display="none"; $("#foldot").style.display="none"; };
    folbox.addEventListener("pointermove",mostra);
    folbox.addEventListener("touchmove",ev=>{ev.preventDefault();mostra(ev);},{passive:false});
    folbox.addEventListener("pointerleave",some);
    folbox.addEventListener("touchend",some);
  }
}

function calData(){
  const posts={}, stories={}, dues={}, evs={};
  (D.posts.all||[]).forEach(p=>{ if(p.ts){ (posts[p.ts]=posts[p.ts]||[]).push(p); } });
  ((D.stories||{}).items||[]).forEach(x=>{ if(x.ts){ (stories[x.ts]=stories[x.ts]||[]).push(x); } });
  ((D.fila||{}).agenda||[]).forEach(a=>{ if(a.due){ (dues[a.due]=dues[a.due]||[]).push(a); } });
  ((D.fila||{}).eventos||[]).forEach(e=>{ if(e.date){ (evs[e.date]=evs[e.date]||[]).push(e); } });
  return {posts,stories,dues,evs};
}
function renderCal(){
  const {posts,stories,dues,evs}=calData();
  const MH=D.melhor_hora||{};
  const DOW={"seg":0,"ter":1,"qua":2,"qui":3,"sex":4,"sáb":5,"dom":6};
  const RENDE={por:{},max:0};
  (MH.dias||[]).forEach(x=>{const i=DOW[x.nome];if(i===undefined)return;
    const v=parseFloat(String(x.er).replace(",","."))||0;
    RENDE.por[i]={er:v,n:x.n,txt:x.er};if(v>RENDE.max)RENDE.max=v;});
  if(!selDay){   // abre já no dia de hoje, ou no próximo dia que tem algo (nunca calendário mudo)
    const hj=new Date(), z=n=>String(n).padStart(2,"0");
    const hoje=hj.getFullYear()+"-"+z(hj.getMonth()+1)+"-"+z(hj.getDate());
    const temAlgo=d=>(posts[d]||[]).length||(stories[d]||[]).length||(dues[d]||[]).length||(evs[d]||[]).length;
    if(temAlgo(hoje)) selDay=hoje;
    else{
      const fut=Object.keys(Object.assign({},posts,stories,dues,evs)).filter(d=>d>=hoje).sort();
      selDay=fut[0]||hoje;
    }
  }
  $("#cmes").textContent=MESES[calM]+" "+calY;
  const first=new Date(calY,calM,1);
  const off=(first.getDay()+6)%7;
  const nd=new Date(calY,calM+1,0).getDate();
  const today=new Date(); const tIso=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  let h="";
  for(let i=0;i<off;i++) h+='<div class="cd out"></div>';
  for(let d=1;d<=nd;d++){
    const iso=calY+"-"+String(calM+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const wd=(new Date(calY,calM,d).getDay()+6)%7;
    const hasP=posts[iso], hasS=stories[iso], hasD=dues[iso], hasE=evs[iso];
    const img=hasP?IMGMAP[hasP[0].url]:null;
    let inner='<span class="dn num">'+d+"</span>";
    if(img) inner+='<img class="th" src="'+img+'" alt="">';
    const dots=[];
    if(hasP&&!img) dots.push("d-post");
    if(hasS) dots.push("d-story");
    if(hasD) dots.push("d-due");
    if(hasE) dots.push("d-ev");
    if(dots.length) inner+='<div class="dots">'+dots.slice(0,3).map(c=>'<span class="dot '+c+'"></span>').join("")+"</div>";
    // fundo = o que rende naquele dia da semana (camada 1 do "melhor horário", padrão Metricool)
    let bg="";
    if(RENDE.max>0&&RENDE.por[wd]&&RENDE.por[wd].n>0&&iso>=tIso){
      const f=RENDE.por[wd].er/RENDE.max;
      if(f>0) bg=';background:rgba(124,58,237,'+(0.05+f*0.17).toFixed(3)+')';
      if(RENDE.por[wd].er===RENDE.max) inner+='<span class="best" aria-label="seu melhor dia">★</span>';
    }
    h+='<div class="cd'+(wd>=5?" wknd":"")+(iso===tIso?" today":"")+(iso===selDay?" sel":"")+'" data-d="'+iso+'" style="position:relative'+bg+'" role="button" tabindex="0">'+inner+"</div>";
  }
  $("#cal").innerHTML=h;
  const lg=document.getElementById("callegenda");
  if(lg) lg.innerHTML=(RENDE.max>0)
    ? "⏰ o fundo roxo mostra o que rende em cada dia da semana (ER médio dos seus posts) · ★ = seu melhor dia · só nos dias que ainda vão acontecer"
    : "";
  document.querySelectorAll(".cd[data-d]").forEach(c=>{
    c.addEventListener("click",()=>pickDay(c.dataset.d));
    c.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pickDay(c.dataset.d); } });
  });
  if(selDay) dayPanel(selDay);
}

// ====================== AGIR DE DENTRO ======================
// A página escreve no Trello direto do navegador (a API responde com CORS liberado,
// verificado em 04/08). A chave do app vem no data.json, que é publicado CIFRADO.
// O token é DELA: digitado uma vez e guardado cifrado no aparelho com a mesma chave
// PBKDF2 que abre a Central. Nada destrutivo: arquivar e apagar não existem aqui.
let UNDO = null;

function chaveSessao(){
  const b = sessionStorage.getItem("cv3_key");
  if(!b) return null;
  const bin = atob(b), arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr.buffer;
}
async function aesKey(){
  const bits = chaveSessao();
  if(!bits) return null;
  return crypto.subtle.importKey("raw", bits, {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
}
async function guardaToken(tok){
  const k = await aesKey();
  if(!k){ localStorage.setItem("cv3_tok_claro", tok); return; }   // modo claro local
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, new TextEncoder().encode(tok));
  localStorage.setItem("cv3_tok", JSON.stringify({
    iv: btoa(String.fromCharCode(...iv)),
    ct: btoa(String.fromCharCode(...new Uint8Array(ct)))
  }));
}
async function leToken(){
  const claro = localStorage.getItem("cv3_tok_claro");
  if(claro) return claro;
  const raw = localStorage.getItem("cv3_tok");
  if(!raw) return null;
  const k = await aesKey();
  if(!k) return null;
  try{
    const o = JSON.parse(raw);
    const b = s => { const bin=atob(s), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; };
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(o.iv)}, k, b(o.ct));
    return new TextDecoder().decode(pt);
  }catch(e){ return null; }
}

async function trello(metodo, caminho, params){
  const A = (D.acao||{});
  const tok = await leToken();
  if(!A.key || !tok) throw new Error("falta a chave do Trello nesta rodada");
  const u = new URL("https://api.trello.com/1" + caminho);
  u.searchParams.set("key", A.key); u.searchParams.set("token", tok);
  Object.entries(params||{}).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u, {method: metodo});
  if(!r.ok) throw new Error(r.status===401?"o Trello não aceitou o seu acesso · cole o código de novo":r.status===404?"esse card não existe mais no board":"o Trello não respondeu agora · tente de novo em 1 minuto");
  return r.json();
}

// as ações possíveis para um card, sempre com a frase inteira antes de acontecer
async function agir(cardId, titulo, contexto){
  const A = D.acao || {};
  if(!A.key){ aviso("esta rodada saiu sem a chave do Trello · tente na próxima"); return; }
  if(!(await leToken())){ return pedeToken(); }
  const L = A.listas || {};
  const acoes = [];
  if(L.publicar && contexto !== "publicar")
    acoes.push({id:"aprovar", ico:"✅", rot:"Aprovar", frase:"mover para a lista Publicar",
      faz: () => trello("PUT", "/cards/" + cardId, {idList: L.publicar})});
  acoes.push({id:"concluir", ico:"✓", rot:"Concluir o prazo", frase:"marcar o prazo como concluído",
    faz: () => trello("PUT", "/cards/" + cardId, {dueComplete: "true"})});
  acoes.push({id:"adiar", ico:"📅", rot:"Adiar", frase:"jogar o prazo para o próximo dia útil",
    faz: () => {
      const d = new Date(); d.setDate(d.getDate() + 1);
      while(d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);  // fim de semana é dela
      d.setHours(12,0,0,0);
      return trello("PUT", "/cards/" + cardId, {due: d.toISOString()});
    }});
  acoes.push({id:"comentar", ico:"💬", rot:"Comentar", frase:"escrever um comentário no card", pedeTexto:true,
    faz: (txt) => trello("POST", "/cards/" + cardId + "/actions/comments", {text: txt})});

  const sh = sheet(
    '<div class="sm">agir neste card</div>'
    + '<div style="font:800 15px/1.35 Inter,sans-serif;margin:4px 0 12px">' + esc(titulo) + "</div>"
    + acoes.map(a => '<button data-a="' + a.id + '" style="display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;font:600 13.5px Inter,sans-serif;cursor:pointer;min-height:48px"><span style="font-size:17px">' + a.ico + '</span><span>' + a.rot + '<br><span class="sm" style="font-weight:400">' + a.frase + "</span></span></button>").join("")
    + '<div class="sm" style="margin-top:6px">arquivar e apagar não existem aqui · isso é sempre no board</div>');

  acoes.forEach(a => {
    sh.querySelector('[data-a="' + a.id + '"]').onclick = async () => {
      let txt = null;
      if(a.pedeTexto){
        txt = prompt("o que escrever no card?");
        if(!txt) return;
      }
      fechaSheet();
      const carregando = aviso("⏳ " + a.rot.toLowerCase() + "…");
      try{
        const antes = await trello("GET", "/cards/" + cardId, {fields:"idList,due,dueComplete"});
        await a.faz(txt);
        carregando.remove();
        if(a.id === "comentar"){
          aviso("✓ comentário publicado no card");
          setTimeout(pedeRodada, 500);
        } else {
          avisoComUndo("✓ " + a.rot.toLowerCase() + " feito", () =>
            trello("PUT", "/cards/" + cardId, {
              idList: antes.idList, due: antes.due || "", dueComplete: String(!!antes.dueComplete)
            }));
          setTimeout(pedeRodada, 800);
        }
      }catch(e){
        carregando.remove();
        aviso("⚠ " + e.message + " · o card não mudou", "#B45309");
      }
    };
  });
}


async function deriveKey(pw,saltB64,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(saltB64),iterations:iter,hash:"SHA-256"},base,256);
}
async function decryptEnv(env,keyBits){
  const key=await crypto.subtle.importKey("raw",keyBits,{name:"AES-GCM"},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},key,b64(env.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function boot(){
  if(MODE!=="enc"){
    try{
      const r=await fetch("./data.json",{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      render(await r.json()); return;
    }catch(e){
      $("#err").textContent="Modo claro: não consegui ler data.json ("+e.message+"). Sirva a pasta com um servidor (python3 -m http.server).";
      $("#err").hidden=false; return;
    }
  }
  let env=null;
  try{ const r=await fetch("./data.enc",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j&&j.ct) env=j; } }catch(e){}
  if(!env){
    $("#err").textContent="Não consegui carregar os dados desta rodada. Puxe a tela para recarregar. Se continuar assim, a última publicação falhou e eu já fui avisada.";
    $("#err").hidden=false; return;
  }
  const cached=sessionStorage.getItem("cv3_key");
  if(cached){ try{ const d=await decryptEnv(env,b64(cached).buffer); $("#skel").hidden=false; setTimeout(()=>render(d),16); return; }catch(e){ sessionStorage.removeItem("cv3_key"); } }
  $("#lock").hidden=false; $("#pw").focus();
  const tenta=async()=>{
    const pw=$("#pw").value; if(!pw) return;
    $("#lockmsg").textContent="";
    try{
      const bits=await deriveKey(pw,env.salt,env.iter||200000);
      const data=await decryptEnv(env,bits);
      sessionStorage.setItem("cv3_key",btoa(String.fromCharCode(...new Uint8Array(bits))));
      $("#lock").hidden=true; $("#skel").hidden=false;
      setTimeout(()=>render(data),16);
    }catch(e){ $("#lockmsg").textContent="senha não bateu · tenta de novo"; }
  };
  $("#go").addEventListener("click",tenta);
  $("#pw").addEventListener("keydown",e=>{ if(e.key==="Enter") tenta(); });
}
boot();
