<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central @mispace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ tokens · studio.ourspace.com.br (produto vivo · 31/07) ============ */
:root{
  --canvas:#F8FAFC; --card:#FFFFFF; --off:#F5F3FF; --line:#E2E8F0; --line2:#F1F5F9;
  --ink:#0F172A; --sub:#64748B; --faint:#94A3B8;
  --brand:#7C3AED; --brand-dark:#6D28D9; --sec:#6366F1;
  --grad:linear-gradient(135deg,#7C3AED 0%,#6366F1 100%);
  --brand-pale:#EDE9FE; --gold:#7C3AED; --gold-warm:#6366F1; --gold-pale:#F5F3FF; --gold-deep:#6D28D9; --nude:#C7D2FE;
  --up:#059669; --up-bg:#D1FAE5; --mid:#64748B; --mid-bg:#F1F5F9;
  --down:#DC2626; --down-bg:#FEE2E2; --age:#B45309; --age-bg:#FEF3C7; --slate:#0284C7;
  --sh-sm:0 10px 30px -15px rgba(124,58,237,.15); --sh-md:0 20px 40px -15px rgba(124,58,237,.16);
  --nav-h:60px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:14px/1.5 'Inter',system-ui,sans-serif;font-weight:400;color:var(--ink);background:var(--canvas);
     -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px)}
a{color:var(--ink)}
.disp{font-family:'Plus Jakarta Sans','Inter',sans-serif}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-sm);padding:14px 15px;margin:10px 0}
.k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.pill{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-up{color:var(--up);background:var(--up-bg)} .p-mid{color:var(--mid);background:var(--mid-bg)}
.p-down{color:var(--down);background:var(--down-bg)} .p-none{color:var(--sub);background:var(--mid-bg)}
.age{display:inline-block;font-size:10.5px;color:var(--faint);margin-left:6px;font-weight:500}
.age.stale{color:var(--age);background:var(--age-bg);border-radius:6px;padding:0 6px;font-weight:600}
/* tags de pilar · pastéis quentes que casam com o dourado */
.tag{display:inline-flex;align-items:center;gap:6px;height:23px;padding:0 10px;border-radius:8px;
     font-size:11.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-aut{background:#EDE9FE;color:#5B21B6}.t-edu{background:#E0F2FE;color:#0369A1}
.t-pro{background:#E0E7FF;color:#3730A3}.t-ofe{background:#F1F5F9;color:#475569}
.t-des{background:#FCE7F3;color:#9D174D}
.btn{display:inline-block;background:var(--grad);color:#fff;text-decoration:none;font-weight:600;
     border-radius:10px;padding:12px 22px;font-size:13.5px;border:0;cursor:pointer;letter-spacing:.01em}
h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:21px;font-weight:700;color:var(--ink);margin:20px 2px 4px;line-height:1.15}
h2 .age{vertical-align:3px}
.sub-h{font-size:12px;color:var(--sub);margin:0 2px 6px}
details summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--gold-deep)}
details[open] summary{color:var(--ink)}
details .body{font-size:12.5px;color:var(--sub);padding:6px 0 2px;line-height:1.55}
.linha{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:13px;align-items:baseline}
.linha:first-of-type{border-top:0}
.linha .n{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:21px}
.sm{font-size:11.5px;color:var(--sub)}
.golink{font-weight:600;color:var(--gold-deep);text-decoration:none;font-size:12.5px;white-space:nowrap}
/* logos dos canais */
.logo{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;vertical-align:-8px;margin-right:8px}
.logo svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.logo b{font:700 12px 'Inter',sans-serif;color:#fff}
.lg-ig{background:#C13584}.lg-tt{background:#1A1A1A}.lg-li{background:#0A66C2}.lg-blog{background:var(--grad)}.lg-lab{background:var(--brand-dark)}
/* ============ lock ============ */
#lock{position:fixed;inset:0;background:var(--canvas);display:flex;align-items:center;justify-content:center;z-index:60}
#lock[hidden],#app[hidden],#err[hidden]{display:none}
#lock .box{width:min(330px,88vw);text-align:center}
#lock .dots{height:22px;margin:0 auto 16px;width:220px;background:radial-gradient(circle,var(--gold) 1.5px,transparent 1.7px) 0 0/11px 11px}
#lock h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:30px;font-weight:700}
#lock input{width:100%;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin:14px 0 10px;background:#fff;font-family:'Inter',sans-serif}
#lockmsg{font-size:13px;color:var(--down);min-height:18px}
/* ============ topo + navegação ============ */
#top{position:sticky;top:0;z-index:40;background:rgba(245,243,240,.96);border-bottom:1px solid var(--line);padding:9px 0}
#top .row{display:flex;align-items:center;gap:10px}
#top .ava{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--gold-pale);border:2px solid transparent;background-image:linear-gradient(#fff,#fff),var(--grad);background-origin:border-box;background-clip:content-box,border-box}
#top .oi{font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:700;line-height:1.05}
#top .dt{font-size:11px;color:var(--sub)}
.marcha{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--gold-deep);background:var(--gold-pale);
        border:1px solid var(--brand-pale);border-radius:999px;padding:5px 12px;text-decoration:none;white-space:nowrap}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);
     padding-bottom:env(safe-area-inset-bottom)}
#nav .row{display:flex;max-width:640px;margin:0 auto}
#nav button{flex:1;height:var(--nav-h);border:0;background:none;cursor:pointer;display:flex;flex-direction:column;
            align-items:center;justify-content:center;gap:3px;font:600 9.5px 'Inter',sans-serif;letter-spacing:.06em;color:var(--faint)}
#nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
                border-radius:999px;padding:3px 12px;box-sizing:content-box}
#nav button[aria-selected="true"]{color:var(--ink)}
#nav button[aria-selected="true"] svg{background:var(--gold-pale);color:var(--gold-deep)}
#nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.view[hidden]{display:none}
@media(min-width:768px){
  body{padding-bottom:20px;padding-left:220px}
  #nav{left:0;right:auto;top:0;bottom:0;width:220px;border-top:0;border-right:1px solid var(--line)}
  #nav .row{flex-direction:column;padding-top:76px;gap:2px}
  #nav button{flex:0 0 auto;height:46px;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 18px;font-size:12px}
  #nav button svg{padding:3px 8px}
  .wrap{max-width:780px}
}
/* ============ HOJE ============ */
#banner{border-radius:10px;background:var(--age-bg);color:var(--age);font-weight:500;font-size:12.5px;padding:10px 13px;margin:10px 0 0;line-height:1.5}
.acao{border:1.5px solid var(--brand-pale);border-radius:20px;background:linear-gradient(180deg,#fff,var(--off));box-shadow:var(--sh-md);padding:16px;margin:12px 0 8px}
.acao .verb{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:clamp(23px,6vw,30px);line-height:1.12}
.acao .why{color:var(--sub);font-size:13px;margin-top:7px}
.acao .btn{margin-top:13px}
.seca{display:flex;gap:10px;align-items:baseline;padding:11px 13px}
.seca .tx{font-size:12.5px;color:var(--sub)}.seca .tx b{font-weight:600;color:var(--ink)}
.seca .golink{margin-left:auto}
/* segmented */
.seg{position:sticky;top:59px;z-index:30;display:flex;background:var(--mid-bg);border-radius:10px;padding:3px;margin:12px 0 4px}
.seg button{flex:1;height:32px;border:0;border-radius:8px;background:none;font:600 12px 'Inter',sans-serif;color:var(--sub);cursor:pointer}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:var(--sh-sm)}
.subv[hidden]{display:none}
/* KPI cards */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-sm);padding:12px 12px 8px;display:flex;flex-direction:column;position:relative}
.kpi .v{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:36px;line-height:.95;margin:4px 0 2px}
.kpi .d{font-size:11.5px;color:var(--sub)}
.kpi .spark{width:calc(100% + 24px);margin:8px -12px -8px;height:32px;display:block}
.iBtn{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);
      background:var(--off);color:var(--gold-deep);font:600 11px 'Inter',sans-serif;cursor:pointer}
.iBox{display:none;font-size:12px;color:var(--sub);line-height:1.55;margin-top:8px;border-top:1px solid var(--line2);padding-top:8px}
.kpi.aberto .iBox{display:block}
.iBox b{color:var(--ink)}
/* pilares / gráficos */
.chart .row{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;padding:5px 0}
.chart .bar{height:10px;border-radius:6px;background:var(--mid-bg);overflow:hidden;position:relative}
.chart .fill{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:6px}
.chart .val{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:16px;text-align:right}
.prow .bar2{height:9px;border-radius:6px;background:var(--mid-bg);position:relative;overflow:hidden;margin:9px 0 6px}
.prow .real{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:6px}
.prow .alvo{position:absolute;top:-2px;bottom:-2px;width:2.5px;background:var(--ink);opacity:.55}
.prow .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.prow .er{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;color:var(--ink)}
.filtro-on{outline:2px solid var(--gold);outline-offset:1px}
/* posts */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 2px 4px}
.post{position:relative;flex:0 0 152px;aspect-ratio:4/5;scroll-snap-align:start;border-radius:14px;overflow:hidden;
      border:1px solid var(--line);background:var(--mid-bg);text-decoration:none;display:block;box-shadow:var(--sh-sm)}
.post img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post .ov{position:absolute;inset:auto 0 0 0;padding:28px 10px 9px;color:#fff;
          background:linear-gradient(180deg,transparent,rgba(15,23,42,.82))}
.post .er{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:23px;line-height:1}
.post .m{font-size:10px;opacity:.92}
.post .tg{position:absolute;top:7px;left:7px;transform:scale(.9);transform-origin:left top}
.stt{position:relative;flex:0 0 100px;aspect-ratio:9/16;max-height:182px;background:linear-gradient(160deg,var(--off),var(--mid-bg));border:1px solid var(--line);border-radius:14px;overflow:hidden;scroll-snap-align:start;cursor:pointer}
.stt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stt .ov{position:absolute;inset:auto 0 0 0;padding:22px 8px 7px;color:#fff;background:linear-gradient(180deg,transparent,rgba(15,23,42,.85))}
.stt .g{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;line-height:1}
.stt .d{font-size:9.5px;opacity:.92}
.stt .iBtn{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.94)}
.stt.sel{outline:2.5px solid var(--brand);outline-offset:-2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:6px 5px 4px}
td{padding:5px;border-top:1px solid var(--line2)}
tr.dim{opacity:.25}
/* calendário */
.calnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px}
.calnav b{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:700;text-transform:capitalize}
.calnav button{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px;cursor:pointer;color:var(--gold-deep)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.wdays span{font-size:10px;text-transform:uppercase;color:var(--faint);text-align:center;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cd{min-height:58px;border-radius:8px;background:var(--card);border:1px solid var(--line);padding:3px 4px;cursor:pointer;position:relative}
.cd.out{opacity:0;pointer-events:none;border:0;background:none}
.cd.wknd{background:var(--off)}
.cd .dn{font-size:10.5px;font-weight:600;color:var(--sub)}
.cd.today{outline:2px solid var(--gold);outline-offset:-2px}
.cd.today .dn{color:var(--gold-deep)}
.cd.sel{background:var(--gold-pale)}
.cd .th{width:36px;height:36px;border-radius:6px;object-fit:cover;display:block;margin:2px auto 0}
.cd .dots{display:flex;gap:3px;justify-content:center;margin-top:4px}
.cd .dot{width:6px;height:6px;border-radius:50%}
.d-post{background:var(--gold)} .d-story{background:var(--nude)} .d-due{background:var(--age)} .d-ev{background:var(--slate)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin:8px 2px}
.leg i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;font-style:normal}
#daypanel .dp{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
#daypanel .dp:first-of-type{border-top:0}
#daypanel img{width:40px;height:40px;border-radius:8px;object-fit:cover}
#daypanel .tt{font-size:12.5px;font-weight:600;line-height:1.3}
/* fila */
.grp .hd{display:flex;justify-content:space-between;align-items:baseline}
.grp .hd .n{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:27px}
.chartbox{position:relative}
.ctip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:6px 9px;border-radius:8px;transform:translate(-50%,-115%);white-space:nowrap;display:none;box-shadow:var(--sh-sm)}
.ctip .neg{color:#FCA5A5}.ctip .pos{color:#6EE7B7}
.cdot{position:absolute;z-index:4;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid #fff;transform:translate(-50%,-50%);pointer-events:none;display:none}
footer{padding:20px 2px 10px;color:var(--sub);font-size:12px}
footer a{margin-right:12px;font-weight:600;color:var(--gold-deep)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="lock" hidden>
  <div class="box">
    <div class="dots"></div>
    <h1>Central @mispace</h1>
    <p style="font-size:13px;color:var(--sub);margin-top:4px">mesma senha do Escritório</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="senha">
    <div id="lockmsg"></div>
    <button class="btn" id="go" style="width:100%">Abrir</button>
  </div>
</div>

<div id="err" class="wrap" hidden style="padding-top:40vh;text-align:center;color:var(--sub)"></div>
<main id="app" hidden></main>

<nav id="nav" hidden aria-label="Seções"><div class="row">
  <button data-v="hoje" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>HOJE</button>
  <button data-v="agenda" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>AGENDA</button>
  <button data-v="posts" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>POSTS</button>
  <button data-v="analise" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>ANÁLISE</button>
  <button data-v="negocio" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 2v20M16.5 6.5c0-1.7-2-3-4.5-3s-4.5 1.3-4.5 3 2 3 4.5 3 4.5 1.3 4.5 3-2 3-4.5 3-4.5-1.3-4.5-3"/></svg>R$</button>
  <button data-v="fila" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>FILA</button>
</div></nav>

<script>
"use strict";
const MODE="enc"; // o publish_v3 troca para "enc" ao publicar
const $=s=>document.querySelector(s);
window.addEventListener("error",e=>{const el=$("#err");el.textContent="Erro na página: "+e.message;el.hidden=false;});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const DIAS=["segunda","terça","quarta","quinta","sexta","sábado","domingo"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const LIMITES={posts:4,stories:2,learning:9,tiktok:9,linkedin:9,trello:2,crm:2,blog:9,events:9999,ourspacelab:40};
const TAGCLS={"Autoridade":"t-aut","Educação":"t-edu","Prova/bastidores":"t-pro","Desejo/curadoria":"t-des","Oferta":"t-ofe"};
const tag=(p,extra)=>'<span class="tag '+(TAGCLS[p]||"t-aut")+(extra?" "+extra:"")+'">'+esc((p||"").split("/")[0])+"</span>";
const LOGOS={
  ig:'<span class="logo lg-ig"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="#fff" stroke="none"/></svg></span>',
  tt:'<span class="logo lg-tt"><svg viewBox="0 0 24 24"><path d="M14 4v9.5a4 4 0 1 1-3-3.87"/><path d="M14 4c.5 2.6 2.3 4.2 5 4.5"/></svg></span>',
  li:'<span class="logo lg-li"><b>in</b></span>',
  blog:'<span class="logo lg-blog"><svg viewBox="0 0 24 24"><path d="M5 19l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L9 18l-4 1z"/></svg></span>',
  lab:'<span class="logo lg-lab"><b>OS</b></span>'
};

function fmtAge(iso){
  if(!iso) return null;
  const d=new Date(String(iso).slice(0,16).length>10?iso:iso+"T12:00:00");
  const h=(Date.now()-d.getTime())/36e5;
  if(!isFinite(h)) return null;
  if(h<1.5) return "agora há pouco";
  if(h<30) return "há "+Math.round(h)+"h";
  return "há "+Math.round(h/24)+"d";
}
function ageChip(S,key){
  const s=S[key]; if(!s) return "";
  if(!s.ok) return '<span class="age stale">sem dado</span>';
  const rel=fmtAge(s.at); if(!rel) return "";
  const dias=(Date.now()-new Date(String(s.at).slice(0,10)+"T12:00:00").getTime())/864e5;
  const stale=dias>(LIMITES[key]??9);
  return '<span class="age'+(stale?" stale":"")+'">'+(stale?"parado ":"")+rel+"</span>";
}
function pillHtml(p){
  if(!p) return "";
  const cls={up:"p-up",mid:"p-mid",down:"p-down",none:"p-none"}[p.state]||"p-none";
  return '<span class="pill '+cls+'">'+esc(p.sym)+" "+esc(p.word)+"</span>";
}

function sparkSvg(vals,h){

    +'<polyline points="'+pts.join(" ")+' 100,'+h+' 0,'+h+'" fill="rgba(124,58,237,.16)" stroke="none"/>'
    +'<polyline points="'+pts.join(" ")+'" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/></svg>';

      +'<div class="sm num" style="margin-top:4px">no funil (se tudo fechar): '+fmtR(pl.pipe_conf)+(pl.pipe_est?" + "+fmtR(pl.pipe_est)+" est.":"")+"</div>"
      +"</div>";
    if(CR.cobrar&&CR.cobrar.length)
      h+='<div class="card" style="border-left:3px solid var(--age)"><span class="k">💬 Cobrar hoje</span>'
        +CR.cobrar.map(c=>'<div class="linha"><span>'+lk(c.url,esc(c.t),"golink")+'</span><span class="sm num" style="color:var(--age);font-weight:700">'+c.dias+"d parado</span></div>").join("")
        +'<div class="sm" style="margin-top:4px">proposta sem resposta há 5+ dias · 1 mensagem reativa</div></div>';
    h+="<h2>Funil · quem está onde</h2><p class=sub-h>cada nome abre o card no Trello</p>";
    (CR.etapas||[]).forEach(et=>{
      h+='<div class="card"><div class="hd"><span class="k">'+esc(et.nome)+'</span><span class="n num">'+et.n+"</span></div>"
        +et.cards.map(c=>'<div class="linha"><span>'+lk(c.url,esc(c.t),"golink")+'</span><span class="sm num">'+(c.valor?esc(c.valor)+(c.vtipo==="estimativa"?' <span style="opacity:.65">est.</span>':""):"sem valor ainda")+"</span></div>").join("")
        +(et.mais?'<div class="sm">+'+et.mais+" no board</div>":"")+"</div>";
    });
    if(!(CR.etapas||[]).length) h+='<div class="card"><div class="sm">nenhum negócio ativo no funil agora · '+lk(CR.link,"abrir o CRM ↗","golink")+"</div></div>";
    h+='<p class="sm" style="margin:6px 2px">'+lk(CR.link,"abrir o CRM ↗","golink")+' · valor real: digite "R$ 12.000" no título ou na descrição do card que ele entra aqui sozinho na próxima rodada</p>'
      +(FF.curso?'<div class="card"><div class="linha"><span>'+lk(FF.curso.url,esc(FF.curso.t))+"</span><span></span></div></div>":"")
      +'<div class="card"><span class="k">Como isso atualiza</span><div class="sm" style="margin-top:6px">o robô lê o board CRM ao vivo em TODA rodada da Central (as horas estão no card Atualizações, aba FILA) · mexeu no Trello, o webhook republica em ~1-2 min · nada aqui é digitado à mão</div></div>';
  } else {
    h+='<div class="card"><span class="age stale">CRM sem dado nesta rodada</span></div>';
  }
  h+="</section>";

  // ---------- FILA ----------
  const F=D.fila;
  h+='<section class="view wrap" id="v-fila" hidden>';
  if(F){
    const grp=(emoji,nome,f)=>'<div class="card grp"><div class="hd"><span class="k">'+emoji+" "+nome+'</span><span class="n num">'+f.n+"</span></div>"
      +(f.antigo?'<div class="sm" style="margin-top:4px">mais antigo: '+lk(f.antigo.url,esc(f.antigo.t),"golink")+" · desde "+esc(f.antigo.desde)+"</div>":'<div class="sm" style="margin-top:4px">vazia</div>')+"</div>";
    h+='<h2>A fila '+ageChip(S,"trello")+"</h2><p class=sub-h>o gargalo real · aprovar é sempre seu</p>"
      +grp("👀","Aprovar",F.aprovar)+grp("🎬","Gravar",F.gravar)+grp("♻️","Repurpose",F.repurpose)
      +"<h2>Pautas · de onde começar</h2><div class=card>"
      +((D.pautas&&D.pautas.length)?D.pautas.map(p=>'<div class="linha"><span>'+lk(p.url,esc(p.t),"golink")+"</span><span></span></div>").join(""):'<div class="sm">lista Ideias vazia</div>')
      +((D.learning&&D.learning.action)?'<div class="sm" style="margin-top:4px"><b>por quê agora:</b> '+esc(D.learning.action)+"</div>":"")
      +'<div class="sm" style="margin-top:4px">'+lk(F.ideias.link,"lista Ideias ↗","golink")+' · '+F.ideias.n+' pautas vivas · o dinheiro mudou para a aba <a class="golink" href="#" onclick="showView(\'negocio\');return false">R$</a></div>'
      +"</div>";
  } else {
    h+='<div class="card"><span class="age stale">Trello sem dado nesta rodada</span></div>';
  }
  const NOMES={posts:"Instagram · posts",stories:"Instagram · stories",trello:"Trello (fila/agenda)",crm:"CRM (pipeline)",learning:"Leitura da semana",tiktok:"TikTok",linkedin:"LinkedIn",events:"Eventos (agenda)",blog:"Blog (Wix)",ourspacelab:"@ourspacelab"};
  const fmtAbs=iso=>{ if(!iso) return "sem carimbo"; const t=String(iso); return t.slice(8,10)+"/"+t.slice(5,7)+(t.length>10?" "+t.slice(11,16):""); };
  h+='<h2 id="atualizacoes">Atualizações</h2><p class=sub-h>quando cada dado chegou · o ↻ lá em cima pede uma rodada nova (fica pronta em ~2 min)</p><div class="card">'
    +Object.keys(NOMES).filter(k=>S[k]).map(k=>{
      const st=S[k]; const dias=st.at?(Date.now()-new Date(String(st.at).slice(0,10)+"T12:00:00").getTime())/864e5:99;
      const ok=st.ok&&dias<=(LIMITES[k]??9);
      if(!st.at) return '<div class="linha"><span>'+esc(NOMES[k])+'</span><span class="sm num">'+(st.ok?"conferido nesta rodada":"sem dado")+"</span></div>";
      return '<div class="linha"><span>'+esc(NOMES[k])+'</span><span class="sm num" style="font-weight:600;color:'+(ok?"var(--sub)":"var(--age)")+'">'+fmtAbs(st.at)+(ok?"":" · parado")+"</span></div>";
    }).join("")+"</div>";
  h+="<footer>"+D.links.map(l=>lk(l.url,esc(l.t)+" ↗")).join("")
    +'<div style="margin-top:10px" class="num">Central @mispace v3 · montado '+esc((D.meta.built_at||"").replace("T"," "))+" (BRT)"
    +(D.qa&&D.qa.status?" · QA "+esc(D.qa.status):"")+"</div></footer></section>";

  $("#app").innerHTML=h; $("#app").hidden=false; $("#nav").hidden=false;

  document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>showView(b.dataset.v)));
  document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>showSub(b.dataset.s)));
  document.querySelectorAll(".kpi .iBtn").forEach(b=>b.addEventListener("click",()=>{
    document.getElementById("kpi"+b.dataset.i).classList.toggle("aberto");
  }));
  const stAbre=i=>{
    const x=(D.stories.items||[])[i]; if(!x) return;
    document.querySelectorAll(".stt").forEach(n=>n.classList.toggle("sel",n.dataset.si==i));
    $("#stinfo").innerHTML='<span class="k">Story de '+esc(x.d)+" "+x.type+'</span><p style="font-size:13px;margin-top:6px">'+esc(x.mini||"")+"</p>";
  };
  document.querySelectorAll(".stt").forEach(n=>{
    n.addEventListener("click",()=>stAbre(n.dataset.si));
    n.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); stAbre(n.dataset.si); } });
  });
  $("#carimbo").addEventListener("click",()=>{showView("fila");setTimeout(()=>{const a=document.getElementById("atualizacoes");if(a)a.scrollIntoView({behavior:"smooth"});},80);});
  let _lm=null;
  async function _headLM(){try{const r=await fetch((MODE==="enc"?"data.enc":"data.json")+"?v="+Date.now(),{method:"HEAD",cache:"no-store"});return r.headers.get("last-modified")||r.headers.get("etag");}catch(e){return null;}}
  async function vigiaRodada(){
    _lm=_lm||await _headLM();
    const t0=Date.now();
    const iv=setInterval(async()=>{
      if(Date.now()-t0>6*60*1000){clearInterval(iv);return;}
      const lm=await _headLM();
      if(lm&&_lm&&lm!==_lm){clearInterval(iv);
        let n=document.getElementById("novaRodada");
        if(!n){n=document.createElement("button");n.id="novaRodada";
          n.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:99;background:#7C3AED;color:#fff;border:0;border-radius:20px;padding:10px 18px;font:700 13px Inter,sans-serif;box-shadow:0 6px 20px rgba(124,58,237,.35);cursor:pointer";
          n.textContent="✓ Rodada nova no ar · toque para recarregar";
          n.onclick=()=>location.reload();document.body.appendChild(n);}
      }
    },25000);
  }
  $("#refresh").addEventListener("click",()=>{
    fetch("https://office-trello.contatomichelledouglas.workers.dev/",{method:"POST",mode:"no-cors",body:"{}"});
    vigiaRodada();
    const b=$("#refresh"); b.textContent="✓"; b.disabled=true;
    const av=$("#banner");
    const msg='pedido de atualização enviado · a página nova fica pronta em ~2 minutos · depois é só recarregar';
    if(av){ av.textContent=msg; } else { const d=document.createElement("div"); d.id="banner"; d.textContent=msg; $("#v-hoje").prepend(d); }
  });
  const folbox=$("#folbox");
  if(folbox){
    const serie=(D.followers||{}).series||[];
    const vals=serie.map(p=>p.v), lo=Math.min(...vals), hi=Math.max(...vals), rng=(hi-lo)||1;
    const mostra=ev=>{
      const r=folbox.getBoundingClientRect();
      const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
      const i=Math.max(0,Math.min(serie.length-1,Math.round(cx/r.width*(serie.length-1))));
      const p=serie[i], ant=i>0?serie[i-1]:null;
      const dd=p.d.slice(8,10)+"/"+p.d.slice(5,7);
      const delta=ant?p.v-ant.v:null;
      const dtx=delta===null?"":(delta>0?' · <span class="pos">+'+delta+" no dia</span>":delta<0?' · <span class="neg">'+delta+" no dia</span>":" · = igual");
      const x=i/(serie.length-1)*r.width;
      const svgTop=folbox.querySelector("svg").offsetTop, svgH=folbox.querySelector("svg").offsetHeight;
      const y=svgTop+( (26-(p.v-lo)/rng*20)/30 )*svgH;
      const tip=$("#foltip"), dot=$("#foldot");
      tip.innerHTML="<b>"+dd+"</b> · "+String(p.v).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" seguidores"+dtx;
      tip.style.left=Math.max(70,Math.min(r.width-70,x))+"px"; tip.style.top=y+"px"; tip.style.display="block";
      dot.style.left=x+"px"; dot.style.top=y+"px"; dot.style.display="block";
    };
    const some=()=>{ $("#foltip").style.display="none"; $("#foldot").style.display="none"; };
    folbox.addEventListener("pointermove",mostra);
    folbox.addEventListener("touchmove",ev=>{ev.preventDefault();mostra(ev);},{passive:false});
    folbox.addEventListener("pointerleave",some);
    folbox.addEventListener("touchend",some);
  }
  $("#cprev").addEventListener("click",()=>moveCal(-1));
  $("#cnext").addEventListener("click",()=>moveCal(1));
  const now=new Date(); calY=now.getFullYear(); calM=now.getMonth();
  renderCal();
  // deep-link: #agenda · #analise/pilares · #posts ...
  const hash=(location.hash||"").slice(1);
  if(hash){ const [v,s]=hash.split("/"); if(document.getElementById("v-"+v)){ showView(v); if(s) showSub(s); } }
}

function showView(v){
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.hidden=(s.id!=="v-"+v));
  scrollTo({top:0});
}
function showSub(s){
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-selected",x.dataset.s===s));
  document.querySelectorAll(".subv").forEach(el=>el.hidden=(el.id!=="s-"+s));
}

function calData(){
  const posts={}, stories={}, dues={}, evs={};
  (D.posts.all||[]).forEach(p=>{ if(p.ts){ (posts[p.ts]=posts[p.ts]||[]).push(p); } });
  ((D.stories||{}).items||[]).forEach(x=>{ if(x.ts){ (stories[x.ts]=stories[x.ts]||[]).push(x); } });
  ((D.fila||{}).agenda||[]).forEach(a=>{ if(a.due){ (dues[a.due]=dues[a.due]||[]).push(a); } });
  ((D.fila||{}).eventos||[]).forEach(e=>{ if(e.date){ (evs[e.date]=evs[e.date]||[]).push(e); } });
  return {posts,stories,dues,evs};
}
function renderCal(){
  const {posts,stories,dues,evs}=calData();
  $("#cmes").textContent=MESES[calM]+" "+calY;
  const first=new Date(calY,calM,1);
  const off=(first.getDay()+6)%7;
  const nd=new Date(calY,calM+1,0).getDate();
  const today=new Date(); const tIso=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  let h="";
  for(let i=0;i<off;i++) h+='<div class="cd out"></div>';
  for(let d=1;d<=nd;d++){
    const iso=calY+"-"+String(calM+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const wd=(new Date(calY,calM,d).getDay()+6)%7;
    const hasP=posts[iso], hasS=stories[iso], hasD=dues[iso], hasE=evs[iso];
    const img=hasP?IMGMAP[hasP[0].url]:null;
    let inner='<span class="dn num">'+d+"</span>";
    if(img) inner+='<img class="th" src="'+img+'" alt="">';
    const dots=[];
    if(hasP&&!img) dots.push("d-post");
    if(hasS) dots.push("d-story");
    if(hasD) dots.push("d-due");
    if(hasE) dots.push("d-ev");
    if(dots.length) inner+='<div class="dots">'+dots.slice(0,3).map(c=>'<span class="dot '+c+'"></span>').join("")+"</div>";
    h+='<div class="cd'+(wd>=5?" wknd":"")+(iso===tIso?" today":"")+(iso===selDay?" sel":"")+'" data-d="'+iso+'" role="button" tabindex="0">'+inner+"</div>";
  }
  $("#cal").innerHTML=h;
  document.querySelectorAll(".cd[data-d]").forEach(c=>{
    c.addEventListener("click",()=>pickDay(c.dataset.d));
    c.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pickDay(c.dataset.d); } });
  });
  if(selDay) dayPanel(selDay);
}
function moveCal(dir){ calM+=dir; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} renderCal(); }
function pickDay(iso){ selDay=iso; renderCal(); dayPanel(iso); }
function dayPanel(iso){
  const {posts,stories,dues,evs}=calData();
  const dd=iso.slice(8,10)+"/"+iso.slice(5,7);
  let rows="";
  (posts[iso]||[]).forEach(p=>{
    const img=IMGMAP[p.url];
    rows+='<div class="dp">'+(img?'<img src="'+img+'" alt="">':"")
      +'<div><div class="tt">'+esc(p.t||"post")+'</div><div class="sm">'+tag(p.pilar)+' <span class="num">ER '+esc(p.er)+"% · envios "+esc(p.sends)+"</span></div></div>"
      +'<span style="margin-left:auto">'+lk(p.url,"↗","golink")+"</span></div>";
  });
  (stories[iso]||[]).forEach(x=>{
    rows+='<div class="dp"><div><div class="tt">'+x.type+' story</div><div class="sm num">gancho '+(x.gancho??"—")+" · alcance "+(x.reach??"—")+"</div></div></div>";
  });
  (dues[iso]||[]).forEach(a=>{
    rows+='<div class="dp"><div><div class="tt">⏰ '+esc(a.t)+'</div><div class="sm">prazo no board'+(a.ef?" · data comemorativa":"")+"</div></div>"
      +'<span style="margin-left:auto">'+lk(a.url,"↗","golink")+"</span></div>";
  });
  (evs[iso]||[]).forEach(e=>{
    rows+='<div class="dp"><div><div class="tt">🎤 '+esc(e.t)+'</div><div class="sm">evento na agenda</div></div>'
      +'<span style="margin-left:auto">'+lk(e.gcal,"↗","golink")+"</span></div>";
  });
  $("#daypanel").innerHTML='<span class="k">'+dd+"</span>"+(rows||'<div class="sm" style="margin-top:6px">nada neste dia</div>');
}

let FILTRO=null;
function filtra(el){
  const p=el.dataset.pilar;
  FILTRO=(FILTRO===p)?null:p;
  document.querySelectorAll("[data-pilar]").forEach(n=>{
    if(n.classList.contains("prow")){ n.classList.toggle("filtro-on",FILTRO===n.dataset.pilar); return; }
    n.classList.toggle("dim",!!FILTRO&&n.dataset.pilar!==FILTRO);
  });
}

async function deriveKey(pw,saltB64,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(saltB64),iterations:iter,hash:"SHA-256"},base,256);
}
async function decryptEnv(env,keyBits){
  const key=await crypto.subtle.importKey("raw",keyBits,{name:"AES-GCM"},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},key,b64(env.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function boot(){
  if(MODE!=="enc"){
    try{
      const r=await fetch("./data.json",{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      render(await r.json()); return;
    }catch(e){
      $("#err").textContent="Modo claro: não consegui ler data.json ("+e.message+"). Sirva a pasta com um servidor (python3 -m http.server).";
      $("#err").hidden=false; return;
    }
  }
  let env=null;
  try{ const r=await fetch("./data.enc",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j&&j.ct) env=j; } }catch(e){}
  if(!env){
    $("#err").textContent="Não consegui carregar data.enc · tente recarregar; se persistir, a última publicação falhou (ver #ai-reports).";
    $("#err").hidden=false; return;
  }
  const cached=sessionStorage.getItem("cv3_key");
  if(cached){ try{ render(await decryptEnv(env,b64(cached).buffer)); return; }catch(e){ sessionStorage.removeItem("cv3_key"); } }
  $("#lock").hidden=false; $("#pw").focus();
  const tenta=async()=>{
    const pw=$("#pw").value; if(!pw) return;
    $("#lockmsg").textContent="";
    try{
      const bits=await deriveKey(pw,env.salt,env.iter||200000);
      const data=await decryptEnv(env,bits);
      sessionStorage.setItem("cv3_key",btoa(String.fromCharCode(...new Uint8Array(bits))));
      $("#lock").hidden=true; render(data);
    }catch(e){ $("#lockmsg").textContent="senha não bateu · tenta de novo"; }
  };
  $("#go").addEventListener("click",tenta);
  $("#pw").addEventListener("keydown",e=>{ if(e.key==="Enter") tenta(); });
}
boot();
</script>
