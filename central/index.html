<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central @mispace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#6C90F1; --brand-soft:#eef2fe;
  --ink:#15151a; --sub:#5c5c66; --bg:#F6F6F3;
  --card:rgba(255,255,255,.78); --line:rgba(21,21,26,.09);
  --up:#1E7F4F; --up-bg:#e7f3ec; --mid:#4b4b55; --mid-bg:#ededf0;
  --down:#B3402A; --down-bg:#f8e9e4; --age:#A96A00; --age-bg:#fcf1de;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:16px/1.5 'Archivo',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--ink)}
.disp{font-family:'Archivo Black','Archivo',sans-serif;text-transform:uppercase;letter-spacing:.01em}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
/* sem backdrop-filter: em página alta ele causa o paint bug de seções em branco (armadilha conhecida) */
.card{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);font-weight:600}
.pill{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-up{color:var(--up);background:var(--up-bg)} .p-mid{color:var(--mid);background:var(--mid-bg)}
.p-down{color:var(--down);background:var(--down-bg)} .p-none{color:var(--sub);background:var(--mid-bg)}
.age{display:inline-block;font-size:11px;color:var(--sub);margin-left:6px}
.age.stale{color:var(--age);background:var(--age-bg);border-radius:6px;padding:0 6px;font-weight:600}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;
     border-radius:12px;padding:13px 22px;font-size:15px}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:8px 14px;font-size:13px}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin:26px 0 4px;
   font-family:'Archivo Black',sans-serif}
section{scroll-margin-top:64px}
/* lock */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
#lock[hidden],#app[hidden],#err[hidden]{display:none}
#lock .box{width:min(340px,88vw);text-align:center}
#lock input{width:100%;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:14px 0 10px;background:#fff}
#lock .dots{height:26px;margin-bottom:14px;background:radial-gradient(circle,var(--brand) 1.6px,transparent 1.8px) 0 0/12px 12px}
#lockmsg{font-size:13px;color:var(--down);min-height:18px}
/* hero */
#hero{position:relative;min-height:84svh;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
#hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;opacity:.22;filter:saturate(.9)}
#hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,246,243,.55),var(--bg) 78%)}
#hero .in{position:relative;padding:64px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);font-weight:600}
.marcha{position:absolute;top:14px;right:0;font-size:12px;font-weight:700;color:var(--brand);
        border:1.5px solid var(--brand);border-radius:999px;padding:4px 12px;text-decoration:none;background:#fff}
.acao{font-size:clamp(24px,6.4vw,34px);line-height:1.14;margin:10px 0 8px}
.why{color:var(--sub);font-size:15px;max-width:46ch}
.sec-act{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:14px;color:var(--ink)}
.sec-act a{font-weight:600}
.built{font-size:12px;color:var(--sub);margin-top:18px}
#banner{border-radius:12px;background:var(--age-bg);color:var(--age);font-weight:600;font-size:13.5px;
        padding:10px 14px;margin:0 0 6px}
/* nav */
#nav{position:sticky;top:0;z-index:40;background:linear-gradient(var(--bg) 82%,transparent);padding:10px 0 6px}
#nav .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
          mask-image:linear-gradient(90deg,#000 92%,transparent)}
#nav a{flex:0 0 auto;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--sub);
       border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px}
#nav a:first-child{color:var(--brand);border-color:var(--brand)}
/* saúde */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .v{font-family:'Archivo Black',sans-serif;font-size:clamp(26px,7vw,34px);line-height:1.05;margin:2px 0}
.kpi .d{font-size:12.5px;color:var(--sub)}
.spark{width:100%;height:34px;margin-top:6px}
.note{font-size:12px;color:var(--sub);margin:6px 2px}
/* pilares */
.prow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.prow .nm{font-family:'Archivo Black',sans-serif;font-size:13.5px;text-transform:uppercase;flex:1 1 100%}
.bar{flex:1 1 100%;height:8px;border-radius:6px;background:var(--mid-bg);position:relative;overflow:hidden}
.bar .real{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:6px}
.bar .alvo{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
.prow .er{font-weight:700;font-size:14px}
.prow .meta{font-size:12px;color:var(--sub)}
details{margin-top:6px}
summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--sub)}
details[open] summary{color:var(--ink)}
details .body{font-size:13.5px;color:var(--sub);padding:6px 0 2px}
.filtro-on{outline:2px solid var(--brand);outline-offset:1px}
/* posts */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.post{flex:0 0 168px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);
      border-radius:14px;overflow:hidden;text-decoration:none}
.post img{width:100%;height:120px;object-fit:cover;display:block;background:var(--mid-bg)}
.post .b{padding:8px 10px 10px}
.post .er{font-family:'Archivo Black',sans-serif;font-size:20px}
.post .m{font-size:11.5px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:6px 6px 4px}
td{padding:5px 6px;border-top:1px solid var(--line)}
tr.dim{opacity:.28}
td a{font-weight:600}
/* canais e fila */
.linha{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.linha:first-of-type{border-top:0}
.linha .n{font-family:'Archivo Black',sans-serif;font-size:19px}
.linha .sm{font-size:12px;color:var(--sub)}
footer{padding:26px 0 46px;color:var(--sub);font-size:13px}
footer a{margin-right:12px;font-weight:600}
.dots-strip{height:14px;background:radial-gradient(circle,var(--brand) 1.4px,transparent 1.6px) 0 0/11px 11px;opacity:.8;margin:4px 0 10px}
@media(min-width:700px){ .kgrid{grid-template-columns:repeat(4,1fr)} #hero{min-height:72vh} }
</style>
</head>
<body>

<div id="lock" hidden>
  <div class="box">
    <div class="dots"></div>
    <div class="disp" style="font-size:20px">Central @mispace</div>
    <p style="font-size:13.5px;color:var(--sub);margin-top:6px">mesma senha do Escritório</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="senha">
    <div id="lockmsg"></div>
    <button class="btn" id="go" style="border:0;cursor:pointer;width:100%">Abrir</button>
  </div>
</div>

<div id="err" class="wrap" hidden style="padding-top:40vh;text-align:center;color:var(--sub)"></div>
<main id="app" class="wrap" hidden></main>

<script>
"use strict";
const MODE="enc"; // o publish_v3 troca para "enc" ao publicar · nada de sniffing
const $=s=>document.querySelector(s);
window.addEventListener("error",e=>{const el=$("#err");el.textContent="Erro na página: "+e.message;el.hidden=false;});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const DIAS=["segunda","terça","quarta","quinta","sexta","sábado","domingo"];
const LIMITES={posts:4,stories:2,learning:9,tiktok:9,linkedin:9,trello:2,crm:2,blog:9,events:9999,ourspacelab:40};

function fmtAge(iso){
  if(!iso) return null;
  const d=new Date(String(iso).slice(0,16).length>10?iso:iso+"T12:00:00");
  const h=(Date.now()-d.getTime())/36e5;
  if(!isFinite(h)) return null;
  if(h<1.5) return "agora há pouco";
  if(h<30) return "há "+Math.round(h)+"h";
  return "há "+Math.round(h/24)+"d";
}
function ageChip(src,key){
  const s=src[key]; if(!s) return "";
  if(!s.ok) return '<span class="age stale">sem dado</span>';
  const rel=fmtAge(s.at); if(!rel) return "";
  const dias=(Date.now()-new Date(String(s.at).slice(0,10)+"T12:00:00").getTime())/864e5;
  const stale=dias>(LIMITES[key]??9);
  return '<span class="age'+(stale?" stale":"")+'">'+(stale?"parado ":"")+rel+"</span>";
}
function pillHtml(p){
  if(!p) return "";
  const cls={up:"p-up",mid:"p-mid",down:"p-down",none:"p-none"}[p.state]||"p-none";
  return '<span class="pill '+cls+'">'+esc(p.sym)+" "+esc(p.word)+"</span>";
}
function lk(url,txt,cls){ return url?('<a '+(cls?'class="'+cls+'" ':'')+'href="'+esc(url)+'" target="_blank" rel="noopener">'+txt+"</a>"):txt; }

function render(D){
  const S=D.sources||{}, hoje=new Date();
  const kicker="HOJE · "+DIAS[(hoje.getDay()+6)%7]+" "+String(hoje.getDate()).padStart(2,"0")+"/"+String(hoje.getMonth()+1).padStart(2,"0");
  const m=D.meta.marcha||{};
  const heroImg=(D.posts.top3[0]&&D.posts.top3[0].img)||"";
  const t=D.today||{}, main=t.main||{};
  let h='';

  // S1 HOJE
  h+='<section id="hoje"><div id="hero">'
    +(heroImg?'<div class="bg" style="background-image:url('+heroImg+')"></div>':'')
    +'<div class="veil"></div><div class="in">'
    +'<a class="marcha" href="'+esc(m.link||"#")+'" target="_blank" rel="noopener">🎚 '+esc(m.value||"Normal")
    +(m.since?" · desde "+esc(m.since):"")+(m.ok?"":" (padrão)")+"</a>"
    +'<div class="kicker">'+kicker+"</div>"
    +'<div class="acao disp">'+esc(main.t||"…")+"</div>"
    +'<p class="why">'+esc(main.why||"")+"</p>"
    +(main.url?'<p style="margin-top:14px">'+lk(main.url,esc(main.label||"abrir")+" ↗","btn")+"</p>":"")
    +(t.secondary&&t.secondary.length?t.secondary.map(s=>
        '<div class="sec-act">· '+esc(s.t)+(s.url?" "+lk(s.url,"↗"):"")+'<span class="sm" style="color:var(--sub)"> '+esc(s.why||"")+"</span></div>").join(""):"")
    +'<div class="built">montado '+esc(fmtAge(D.meta.built_at)||D.meta.built_at)+" · tudo abaixo mostra a própria data</div>"
    +"</div></div>"
    +(D.meta.alert?'<div id="banner">'+esc(D.meta.alert)+"</div>":"")
    +"</section>";

  // nav
  h+='<nav id="nav"><div class="row">'
    +'<a href="#hoje">HOJE</a><a href="#saude">SAÚDE</a><a href="#pilares">PILARES</a>'
    +'<a href="#posts">O QUE SAIU</a><a href="#canais">CANAIS</a><a href="#fila">FILA</a>'
    +"</div></nav>";

  // S2 SAÚDE
  h+='<section id="saude"><h2>Saúde</h2><div class="kgrid">'
    +D.kpis.map(k=>'<div class="card kpi"><span class="k">'+esc(k.label)+"</span>"
      +'<div class="v">'+esc(k.v)+"</div>"
      +'<div class="d">'+(k.delta?esc(k.delta)+" ":"")+(k.ref?esc(k.ref):"")+"</div>"
      +'<div style="margin-top:6px">'+pillHtml(k.pill)+"</div>"
      +'<div class="d" style="margin-top:5px">'+esc(k.sub)+"</div></div>").join("")
    +"</div>";
  const fs=D.followers||{}, ser=fs.series||[];
  if(ser.length>1){
    const vals=ser.map(p=>p.v), lo=Math.min(...vals), hi=Math.max(...vals), rng=(hi-lo)||1;
    const pts=vals.map((v,i)=>Math.round(i/(vals.length-1)*100)+","+Math.round(30-(v-lo)/rng*24)).join(" ");
    h+='<div class="card"><span class="k">Estou crescendo? · seguidores por coleta</span>'
      +'<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none"><polyline points="'+pts
      +'" fill="none" stroke="#6C90F1" stroke-width="2.2" stroke-linecap="round"/></svg>'
      +'<div class="d">'+ser.map(p=>p.d.slice(8,10)+"/"+p.d.slice(5,7)+": "+("" + p.v).replace(/\B(?=(\d{3})+(?!\d))/g,"."))
      .join(" · ")+"</div></div>";
  }
  h+='<p class="note">'+esc(D.meta.limiar_nota||"")+" · dado dos posts "+ageChip(S,"posts")+"</p></section>";

  // S3 PILARES
  h+='<section id="pilares"><h2>Pilares · a régua</h2>';
  h+=D.pilares.map(p=>{
    const alvoPos=Math.min(p.mix_alvo,100);
    return '<div class="card prow" data-pilar="'+esc(p.nome)+'" onclick="filtra(this)">'
      +'<span class="nm">'+esc(p.nome)+'</span>'
      +'<div class="bar"><div class="real" style="width:'+p.mix_real+'%"></div>'
      +'<div class="alvo" style="left:'+alvoPos+'%"></div></div>'
      +'<span class="er">'+esc(p.er)+'</span><span class="meta">n='+p.n+" · mix "+p.mix_real+"% · alvo "+p.mix_alvo+"%</span>"
      +pillHtml(p.pill)
      +'<details onclick="event.stopPropagation()"><summary>o que entra · para que serve</summary>'
      +'<div class="body"><b>Entra:</b> '+esc(p.oque)+'<br><b>Serve:</b> '+esc(p.paraque)+"</div></details></div>";
  }).join("");
  h+='<p class="note">alvo (marca escura) = '+esc(D.mix_alvo_status)+' · toque num pilar pra filtrar os posts</p>';
  const L=D.learning||{};
  h+='<div class="card"><span class="k">Leitura da semana '+ageChip(S,"learning")+"</span>"
    +'<p style="font-weight:700;margin:6px 0 4px">'+esc(L.headline||"sem leitura ainda")+"</p>"
    +(L.action?'<p style="font-size:14px">→ '+esc(L.action)+"</p>":"")
    +'<details><summary>funcionou · aposentar · testar</summary><div class="body">'
    +(L.won?"<b>Funcionou:</b> "+esc(L.won)+"<br><br>":"")
    +(L.retire?"<b>Aposentar:</b> "+esc(L.retire)+"<br><br>":"")
    +(L.test?"<b>Testar:</b> "+esc(L.test):"")+"</div></details></div></section>";

  // S4 O QUE SAIU
  const P=D.posts;
  h+='<section id="posts"><h2>O que saiu '+ageChip(S,"posts")+"</h2>"
    +'<div class="hscroll">'
    +P.top3.map(p=>'<a class="post" data-pilar="'+esc(p.pilar)+'" href="'+esc(p.url)+'" target="_blank" rel="noopener">'
      +(p.img?'<img src="'+p.img+'" alt="">':'<div style="height:120px;background:var(--mid-bg)"></div>')
      +'<div class="b"><div class="er">'+esc(p.er)+'%</div><div class="m">'+esc(p.pilar)+" · "+esc(p.fmt)+" · "+esc(p.d)+"</div></div></a>").join("")
    +"</div>";
  if(P.recentes.length)
    h+='<div class="card"><span class="k">Mais recentes</span>'
      +P.recentes.map(p=>'<div class="linha" data-pilar="'+esc(p.pilar)+'"><span>'+lk(p.url,esc(p.t||p.d))
      +'<span class="sm"> '+esc(p.d)+" · "+esc(p.pilar)+"</span></span><span class=n>"+esc(p.er)+"%</span></div>").join("")+"</div>";
  h+='<div class="card"><details><summary>os '+P.all.length+' posts da janela</summary>'
    +'<table><tr><th>data</th><th>fmt</th><th>pilar</th><th>ER</th><th>envios</th><th></th></tr>'
    +P.all.map(p=>'<tr data-pilar="'+esc(p.pilar)+'"><td>'+esc(p.d)+"</td><td>"+esc(p.fmt)+"</td><td>"+esc(p.pilar)
      +"</td><td><b>"+esc(p.er)+"</b></td><td>"+esc(p.sends)+"</td><td>"+lk(p.url,"↗")+"</td></tr>").join("")
    +"</table></details></div>";
  const st=D.stories||{};
  h+='<div class="card"><span class="k">Stories · o motor da conta '+ageChip(S,"stories")+"</span>"
    +'<div class="linha"><span>na última semana</span><span class="n">'+ (st.n7??"—") +"</span></div>"
    +'<div class="linha"><span>gancho médio (ficam na 1ª tela)</span><span class="n">'+esc(st.gancho??"—")+"</span></div>"
    +'<div class="linha"><span>saída na 1ª tela</span><span class="n">'+esc(st.saida??"—")+"</span></div>"
    +'<div class="sm" style="margin-top:6px;color:var(--sub)">template: '+esc(st.template||"")+"</div></div></section>";

  // S5 CANAIS
  const C=D.canais||{};
  h+='<section id="canais"><h2>Outros canais</h2>';
  const tk=C.tiktok||{};
  h+='<div class="card"><span class="k">TikTok '+ageChip(S,"tiktok")+"</span>"
    +'<div class="linha"><span>views (7d na coleta)</span><span class="n">'+esc(tk.views||"—")+"</span></div>"
    +'<div class="linha"><span>chega por busca</span><span class="n">'+esc(tk.busca_pct||"—")+"</span></div>"
    +(tk.termos&&tk.termos.length?'<details><summary>o que buscaram pra te achar</summary><div class="body">'
      +tk.termos.map(x=>"· "+esc(x)).join("<br>")+"</div></details>":"")
    +'<div class="sm" style="margin-top:4px">'+lk(tk.url,"abrir TikTok ↗")+"</div></div>";
  const li=C.linkedin||{};
  h+='<div class="card"><span class="k">LinkedIn '+ageChip(S,"linkedin")+"</span>"
    +'<div class="linha"><span>seguidores</span><span class="n">'+esc(li.followers??"—")+"</span></div>"
    +'<div class="linha"><span>posts na semana da coleta</span><span class="n">'+esc(li.posts_week??"—")+"</span></div>"
    +'<div class="sm" style="margin-top:4px">'+esc(li.views_perfil||"")+"</div></div>";
  const bl=C.blog||{};
  h+='<div class="card"><span class="k">Blog (Wix) '+ageChip(S,"blog")+"</span>"
    +(bl.ok?'<div class="linha"><span>'+lk(bl.url,esc(bl.title||"último post"))+'</span><span class="sm">'+esc(bl.date?bl.date.slice(8,10)+"/"+bl.date.slice(5,7):"")+"</span></div>"
           :'<div class="sm">sem leitura do feed nesta rodada</div>')
    +'<div class="sm" style="margin-top:4px">o Wix não fornece número de leitura · métrica = cadência</div></div>';
  const ol=C.ourspacelab;
  if(ol) h+='<div class="card"><span class="k">@ourspacelab '+ageChip(S,"ourspacelab")+'</span>'
    +'<div class="linha"><span>seguidores</span><span class="n">'+esc(ol.followers)+'</span></div>'
    +'<div class="linha"><span>posts</span><span class="n">'+esc(ol.posts??"—")+'</span></div>'
    +'<div class="sm" style="margin-top:4px">contagem mensal (1ª sexta) · '+lk(ol.url,"abrir ↗")+"</div></div>";
  h+="</section>";

  // S6 FILA & AGENDA
  const F=D.fila;
  h+='<section id="fila"><h2>Fila e agenda '+ageChip(S,"trello")+"</h2>";
  if(F){
    const fr=(nome,f)=>'<div class="linha"><span>'+nome
      +(f.antigo?'<span class="sm"> · mais antigo: '+lk(f.antigo.url,esc(f.antigo.t))+" (desde "+esc(f.antigo.desde)+")</span>":"")
      +'</span><span class="n">'+f.n+"</span></div>";
    h+='<div class="card"><span class="k">A fila (o gargalo real)</span>'
      +fr("👀 Aprovar",F.aprovar)+fr("🎬 Gravar",F.gravar)+fr("♻️ Repurpose",F.repurpose)+"</div>";
    h+='<div class="card"><span class="k">Próximos 7 dias</span>'
      +(F.agenda.length?F.agenda.map(a=>'<div class="linha"><span>'+lk(a.url,esc(a.t))
        +(a.ef?' <span class="sm">(data comemorativa)</span>':"")+'</span><span class="sm">'+esc(a.d)+"</span></div>").join("")
        :'<div class="sm">nada com prazo na semana</div>')
      +(F.vencidos&&F.vencidos.n?'<div class="sm" style="margin-top:8px;color:var(--age)">'+F.vencidos.n
        +" cards com prazo vencido · "+lk(F.vencidos.link,"limpar no board ↗")+"</div>":"")+"</div>";
    if(F.eventos&&F.eventos.length)
      h+='<div class="card"><span class="k">Eventos</span>'
        +F.eventos.map(e=>'<div class="linha"><span>'+esc(e.t)+'</span><span class="sm">'+esc(e.d)+"</span></div>").join("")+"</div>";
    h+='<div class="card">'
      +(F.pipeline?'<div class="linha"><span>Pipeline CRM · '+lk(F.pipeline.link,"abrir ↗")+'</span><span class="sm">'+F.pipeline.ativos+" ativos · "+F.pipeline.fechados+" fechados</span></div>":"")
      +(F.curso?'<div class="linha"><span>'+lk(F.curso.url,esc(F.curso.t))+"</span><span></span></div>":"")
      +'<div class="linha"><span>Banco de ideias · '+lk(F.ideias.link,"lista Ideias ↗")+'</span><span class="sm">'+F.ideias.n+" pautas vivas</span></div>"
      +"</div>";
  } else {
    h+='<div class="card"><span class="age stale">Trello sem dado nesta rodada</span></div>';
  }
  h+="</section>";

  h+='<div class="dots-strip"></div><footer>'
    +D.links.map(l=>lk(l.url,esc(l.t)+" ↗")).join("")
    +'<div style="margin-top:10px">Central @mispace v3 · montado '+esc((D.meta.built_at||"").replace("T"," "))+" (BRT)"
    +(D.qa&&D.qa.status?' · QA '+esc(D.qa.status):"")+"</div></footer>";

  $("#app").innerHTML=h; $("#app").hidden=false;
}

let FILTRO=null;
function filtra(el){
  const p=el.dataset.pilar;
  FILTRO=(FILTRO===p)?null:p;
  document.querySelectorAll("[data-pilar]").forEach(n=>{
    if(n.classList.contains("prow")){ n.classList.toggle("filtro-on",FILTRO===n.dataset.pilar); return; }
    n.classList.toggle("dim",!!FILTRO&&n.dataset.pilar!==FILTRO);
  });
}

async function deriveKey(pw,saltB64,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(saltB64),iterations:iter,hash:"SHA-256"},base,256);
  return bits;
}
async function decryptEnv(env,keyBits){
  const key=await crypto.subtle.importKey("raw",keyBits,{name:"AES-GCM"},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},key,b64(env.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function boot(){
  if(MODE!=="enc"){
    try{
      const r=await fetch("./data.json",{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      render(await r.json()); return;
    }catch(e){
      $("#err").textContent="Modo claro: não consegui ler data.json ("+e.message+"). Sirva a pasta com um servidor (python3 -m http.server).";
      $("#err").hidden=false; return;
    }
  }
  let env=null;
  try{ const r=await fetch("./data.enc",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j&&j.ct) env=j; } }catch(e){}
  if(!env){
    $("#err").textContent="Não consegui carregar data.enc · tente recarregar; se persistir, a última publicação falhou (ver #ai-reports).";
    $("#err").hidden=false; return;
  }
  const cached=sessionStorage.getItem("cv3_key");
  if(cached){ try{ render(await decryptEnv(env,b64(cached).buffer)); return; }catch(e){ sessionStorage.removeItem("cv3_key"); } }
  $("#lock").hidden=false; $("#pw").focus();
  const tenta=async()=>{
    const pw=$("#pw").value; if(!pw) return;
    $("#lockmsg").textContent="";
    try{
      const bits=await deriveKey(pw,env.salt,env.iter||200000);
      const data=await decryptEnv(env,bits);
      sessionStorage.setItem("cv3_key",btoa(String.fromCharCode(...new Uint8Array(bits))));
      $("#lock").hidden=true; render(data);
    }catch(e){ $("#lockmsg").textContent="senha não bateu · tenta de novo"; }
  };
  $("#go").addEventListener("click",tenta);
  $("#pw").addEventListener("keydown",e=>{ if(e.key==="Enter") tenta(); });
}
boot();
</script>
